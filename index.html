    '!': [0b00100, 0b00100, 0b00100, 0b00100, 0b00100, 0b00000, 0b00100],
    '+': [0b00000, 0b00100, 0b00100, 0b11111, 0b00100, 0b00100, 0b00000],
    '=': [0b00000, 0b00000, 0b11111, 0b00000, 0b11111, 0b00000, 0b00000],
    '_': [0b00000, 0b00000, 0b00000, 0b00000, 0b00000, 0b00000, 0b11111],
    '#': [0b01010, 0b01010, 0b11111, 0b01010, 0b11111, 0b01010, 0b01010],
    '(': [0b00010, 0b00100, 0b01000, 0b01000, 0b01000, 0b00100, 0b00010],
    ')': [0b01000, 0b00100, 0b00010, 0b00010, 0b00010, 0b00100, 0b01000],
    '×': [0b00000, 0b10001, 0b01010, 0b00100, 0b01010, 0b10001, 0b00000],
    '→': [0b00000, 0b00100, 0b00010, 0b11111, 0b00010, 0b00100, 0b00000],
    '▶': [0b10000, 0b11000, 0b11100, 0b11110, 0b11100, 0b11000, 0b10000],
    '▲': [0b00100, 0b00100, 0b01110, 0b01110, 0b11111, 0b11111, 0b00000],
    '▼': [0b00000, 0b11111, 0b11111, 0b01110, 0b01110, 0b00100, 0b00100],
  };
  const ADV = 6, GW = 5, GH = 7;
  const width = (str, s) => Math.max(0, str.length * ADV - 1) * (s || 1);

  // x,y son la esquina superior izquierda del primer glifo (o el borde que
  // marque align). Todo entero: sin medios pixeles no hay borde suave.
  function draw(str, x, y, s, align, color) {
    s = Math.max(1, Math.round(s || 1));
    let px = Math.round(x);
    if (align === 'center') px = Math.round(x - width(str, s) / 2);
    else if (align === 'right') px = Math.round(x - width(str, s));
    const py = Math.round(y);
    ctx.fillStyle = color || TONE[3];
    for (const ch of str) {
      const g = G[ch] || G[ch.toUpperCase()];
      if (g) {
        for (let r = 0; r < GH; r++) {
          const bits = g[r];
          if (!bits) continue;
          // corridas horizontales: un fillRect por tramo, no uno por punto
          let run = 0;
          for (let c = 0; c <= GW; c++) {
            const on = c < GW && (bits >> (GW - 1 - c)) & 1;
            if (on) run++;
            else if (run) {
              ctx.fillRect(px + (c - run) * s, py + r * s, run * s, s);
              run = 0;
            }
          }
        }
      }
      px += ADV * s;
    }
  }
  return { draw, width, GH, ADV };
})();

// Texto de interfaz. 'tone' es el indice de la paleta: asi se apagaba el texto
// secundario en la Game Boy, con un gris de verdad y no con transparencia.
function text(str, x, y, s, align, tone) {
  Font.draw(str, x, y, s, align, TONE[tone === undefined ? 3 : tone]);
}

/* --------------------------- marcos y botones --------------------------- */
// Cuadro de dialogo (la "window" del hardware): relleno liso, borde de 1 px y
// esquinas recortadas, que es como se arma con tiles.
function winBox(x, y, w, h, inverted) {
  ctx.fillStyle = inverted ? TONE[3] : TONE[0];
  ctx.fillRect(x, y, w, h);
  ctx.fillStyle = inverted ? TONE[0] : TONE[3];
  ctx.fillRect(x + 1, y, w - 2, 1);
  ctx.fillRect(x + 1, y + h - 1, w - 2, 1);
  ctx.fillRect(x, y + 1, 1, h - 2);
  ctx.fillRect(x + w - 1, y + 1, 1, h - 2);
}

// Fila de menu dentro de un cuadro: cursor ▶ parpadeando en la fila elegida,
// y la fila entera en negativo mientras el dedo la aprieta.
function menuRow(label, x, y, w, chosen) {
  const h = 12;
  const box = worldBox(x, y, w, h, label);
  const on = pressed(box);
  if (on) { ctx.fillStyle = TONE[3]; ctx.fillRect(x, y, w, h); }
  if (chosen && !on) text('▶', x + 3, y + 3, 1, 'left', 2 + (blink(320) ? 1 : 0));
  text(label, x + w / 2 + 4, y + 3, 1, 'center', on ? 0 : 3);
  G.buttons.push(box);
}

// Cuadro de menu completo: las filas ya vienen alineadas a la rejilla. Publica
// sus etiquetas en Menu para que la navegacion con los motores sepa que hay.
function menuBox(rows, cx, top, w) {
  const h = 6 + rows.length * 12;
  const x = Math.round(cx - w / 2);
  Menu.offer(rows);
  winBox(x, top, w, h);
  rows.forEach((r, i) => menuRow(r, x + 2, top + 3 + i * 12, w - 4, i === Menu.sel));
  // la ayuda solo si hay donde: en records el cuadro ya va pegado abajo
  if (rows.length > 1 && top + h + 4 + Font.GH <= LH()) {
    text('L/R — MOVE     BOTH — SELECT', cx, top + h + 4, 1, 'center', 1);
  }
  return top + h;
}

/* ------------------------------- iconos -------------------------------- */
// 8x8, como los objetos del hardware. Se dibujan igual que la fuente.
const ICON = {
  //        ...#....    ..##....    .###.#..    .###..#.
  sound: [0b00010000, 0b00110000, 0b01110100, 0b01110010, 0b01110010, 0b01110100, 0b00110000, 0b00010000],
  mute:  [0b00010000, 0b00110000, 0b01110000, 0b01110101, 0b01110010, 0b01110101, 0b00110000, 0b00010000],
};
function icon(bits, x, y, s, tone) {
  ctx.fillStyle = TONE[tone === undefined ? 3 : tone];
  for (let r = 0; r < 8; r++) {
    let run = 0;
    for (let c = 0; c <= 8; c++) {
      const on = c < 8 && (bits[r] >> (7 - c)) & 1;
      if (on) run++;
      else if (run) { ctx.fillRect(x + (c - run) * s, y + r * s, run * s, s); run = 0; }
    }
  }
}

/* ---------------------------- boton de sonido ---------------------------
   Vive arriba a la derecha en todas las pantallas donde existe. La caja se
   comparte con el pointerdown: durante el juego el dedo que lo aprieta no
   debe encender el motor (§13.2), por eso el area de toque es mas grande que
   el icono y se calcula en un solo lugar.
   -------------------------------------------------------------------- */
const MUTE_SCALE = 2;
const muteIcon = () => ({ x: LW - safeW() - 2 * T - 4, y: safeY() + 4, s: MUTE_SCALE });
function muteBox() {
  const m = muteIcon(), pad = 5;
  return worldBox(m.x - pad, m.y - pad, 8 * m.s + 2 * pad, 8 * m.s + 2 * pad, 'MUTE');
}
function muteActive() {
  return screen === SCREEN.PLAY || screen === SCREEN.MENU
      || screen === SCREEN.DEAD || screen === SCREEN.SCORES;
}
function drawMuteButton() {
  const m = muteIcon();
  icon(Sfx.muted ? ICON.mute : ICON.sound, m.x, m.y, m.s, Sfx.muted ? 2 : 3);
  G.buttons.push(muteBox());
}

/* ------------------------------ ayudas fijas ----------------------------
   Las pistas van en un solo renglon pegado al borde de abajo y en el mismo
   orden que los controles: el motor izquierdo en la esquina izquierda, el
   freno al medio y el derecho en la derecha. La posicion ES la explicacion,
   asi que ocupan una franja en vez de tres y ademas ensenan donde tocar.
   Si no entran a lo ancho se prueba la version corta, y si tampoco entra no
   se dibuja nada: mejor sin pistas que con las palabras encimadas.
   -------------------------------------------------------------------- */
const HINT_SETS = [
  ['LEFT THRUST', 'BOTH = BRAKE', 'RIGHT THRUST'],
  ['LEFT', 'BRAKE', 'RIGHT'],
];
function drawControlHints(y, tone) {
  const t = tone === undefined ? 1 : tone;
  const edge = T, gap = 6, cx = LW / 2;
  for (const [l, c, r] of HINT_SETS) {
    const wl = Font.width(l, 1), wc = Font.width(c, 1), wr = Font.width(r, 1);
    const cLeft = cx - wc / 2, cRight = cx + wc / 2;
    if (edge + wl + gap > cLeft) continue;              // el bloque de la izquierda pisa el del medio
    if (cRight + gap > LW - edge - wr) continue;        // ... o el del medio pisa el de la derecha
    text(l, edge, y, 1, 'left', t);
    text(c, cx, y, 1, 'center', t);
    text(r, LW - edge, y, 1, 'right', t);
    return;
  }
}

// Codigo de emparejamiento del celular. SOLO en las pantallas quietas: durante
// la partida no se dibuja nada (§20.2). Cada pantalla elige donde ponerlo, que
// el sitio libre no es el mismo en todas.
function drawLinkCode(x, y, s, align) {
  const st = Link.status();
  align = align || 'left';
  if (st.error) { text('LINK - ' + st.error, x, y, 1, align, 1); return; }
  if (st.linked) {
    if (performance.now() - st.linkedAt < 1600) text('CONTROLLER LINKED', x, y, 1, align, 2);
    return;
  }
  if (!st.code) return;
  // el protocolo y el index.html sobran para tipear a mano en el celular
  const url = Link.url().replace(/^https?:\/\//, '').replace(/index\.html\?/, '?');
  text('PHONE ' + url, x, y, 1, align, 1);
  text(st.code, x, y + T, s || 1, align, 2);
}

/* ------------------------------- pantallas ------------------------------ */
// En pantallas angostas (4:3) el titulo a escala 2 se metia debajo del icono de
// sonido: si no entra dejando libres las esquinas, baja a escala 1. El area del
// tinte usa la misma medida, si no en esas pantallas quedaria mas ancha que el
// titulo que la disimula.
const TITLE = 'MY SPACE DRIFT';
const titleScale = () => (Font.width(TITLE, 2) <= LW - 5 * T ? 2 : 1);

// El titulo es el boton escondido del tinte (§21.1): no se dibuja distinto y,
// mientras el secreto siga sin destapar, tampoco responde al toque suelto, solo
// cuenta. El area se corta antes del boton de sonido, que en pantallas angostas
// le queda encima.
function tintBox() {
  const w = Font.width(TITLE, titleScale());
  const x = Math.round(LW / 2 - w / 2);
  const right = Math.min(x + w, muteIcon().x - 6);   // el boton de sonido manda, se mueva donde se mueva
  return worldBox(x, 0, Math.max(8, right - x), 3 * T, 'TINT');
}

function drawMenu() {
  const cx = LW / 2;
  const ts = titleScale(), tw = Font.width(TITLE, ts);
  text(TITLE, cx, T, ts, 'center', 3);
  G.buttons.push(tintBox());
  ctx.fillStyle = TONE[2];
  ctx.fillRect(Math.round(cx - tw / 2), T + Font.GH * ts + 3, tw, 1);
  if (Tint.osd > 0) text('TINT ' + Tint.name, cx, 3 * T + 6, 1, 'center', 2);
  menuBox(['PLAY', 'HIGH SCORES'], cx, 5 * T, 112);
  if (G.attract) text('DEMO', T / 2, T / 2, 1, 'left', 2);
  else drawLinkCode(cx, 11 * T, 2, 'center');   // el codigo se lee desde el sillon
  drawControlHints(LH() - 2 - Font.GH - safeY(), 1);
  drawMuteButton();
}

function drawHud() {
  // franja de estado: es la window layer de la Game Boy, arriba y fija
  text('SCORE ' + String(Math.floor(G.score)).padStart(6, '0'), safeX() + T / 2, safeY() + T / 2, 1, 'left', 3);
  text('LV ' + G.level, LW - safeW() - 3 * T - 2, safeY() + T / 2, 1, 'right', 3);
  drawMuteButton();
  if (G.levelBanner > 0 && blink(140)) {
    text('LEVEL ' + G.level, LW / 2, LH() / 2 - 7, 2, 'center', 3);
  }
}

function drawDead() {
  const cx = LW / 2;
  text('GAME OVER', cx, 3 * T, 2, 'center', 3);
  text(String(Math.floor(G.score)).padStart(6, '0'), cx, 6 * T, 2, 'center', 3);
  text('LEVEL ' + G.level, cx, 8 * T + 6, 1, 'center', 2);
  if (hs.pending) {
    text('NEW HIGH SCORE', cx, 11 * T, 1, 'center', blink(180) ? 3 : 1);
  } else {
    menuBox(['PLAY AGAIN', 'MENU'], cx, 10 * T, 112);
  }
  drawLinkCode(T / 2, 2, 1);
  drawControlHints(LH() - 2 - Font.GH - safeY(), 1);   // recien murio: es cuando mas sirven
  drawMuteButton();
}

function drawInitials() {
  const cx = LW / 2, cy = LH() / 2;
  text('NEW HIGH SCORE', cx, 2 * T, 2, 'center', 3);
  text('ENTER INITIALS', cx, 5 * T, 1, 'center', 2);
  const s = 4, gap = 8 * s, top = cy - 10;
  for (let i = 0; i < 3; i++) {
    const x = cx + (i - 1) * gap;
    const on = i === hs.slot;
    text(LETTERS[hs.initials[i]], x, top, s, 'center', on ? (blink(200) ? 3 : 1) : 2);
    if (on) {
      ctx.fillStyle = TONE[3];
      ctx.fillRect(Math.round(x - 3 * s), top + 7 * s + 2, 6 * s, 2);
    }
  }
  text('LEFT ▼   RIGHT ▲   BOTH - OK', cx, LH() - 3 * T, 1, 'center', 2);
}

function drawScores() {
  const cx = LW / 2;
  text('HIGH SCORES', cx, T + 4, 2, 'center', 3);
  const list = hs.list.length ? hs.list : Store.cached();
  const rows = hs.fromRun ? ['PLAY AGAIN', 'BACK'] : ['BACK'];
  const boxTop = LH() - 2 - (6 + rows.length * 12);
  const top = 3 * T + 4, rowH = T;
  const x0 = Math.round(cx - 76), x1 = Math.round(cx + 76);
  if (!list.length) text('NO SCORES YET', cx, top + 2 * T, 1, 'center', 2);
  for (let i = 0; i < list.length && top + i * rowH < boxTop - 4; i++) {
    const e = list[i], y = top + i * rowH;
    const tone = i < 3 ? 3 : 2;
    text(String(i + 1).padStart(2, ' '), x0, y, 1, 'left', 1);
    text(e.i, x0 + 18, y, 1, 'left', tone);
    text(String(e.s).padStart(6, '0'), x1 - 30, y, 1, 'right', tone);
    text('LV ' + e.l, x1, y, 1, 'right', 1);
  }
  menuBox(rows, cx, boxTop, 112);
  drawMuteButton();
}

function drawRotate() {
  const cx = LW / 2, cy = LH() / 2;
  text('ROTATE', cx, cy - T, 2, 'center', 3);
  text('YOUR DEVICE', cx, cy + T, 1, 'center', 2);
}

/* ============================ pantallas ============================ */
// Dentro de la partida el unico boton que escucha es el de sonido: el resto de
// la pantalla es motor y no se le puede robar el toque.
function handleHudTap(t) {
  if (!hit(muteBox(), t)) return false;
  Sfx.init(); Sfx.resume(); Sfx.ui();
  Sfx.toggleMute();
  return true;
}

// Lo que hace cada opcion, sin importar si llego por toque o por los motores.
function activate(label) {
  if (!label) return false;
  Sfx.init(); Sfx.resume(); Sfx.ui();
  if (label === 'MUTE') { Sfx.toggleMute(); return true; }
  if (label === 'PLAY') { G.attract = false; startGame(false); return true; }
  if (label === 'HIGH SCORES') { hs.fromRun = false; screen = SCREEN.SCORES; return true; }
  if (label === 'BACK') { screen = SCREEN.MENU; Input.lastTouch = performance.now(); return true; }
  if (label === 'PLAY AGAIN') { startGame(false); return true; }
  if (label === 'MENU') { screen = SCREEN.MENU; Input.lastTouch = performance.now(); return true; }
  return false;
}

function handleMenuTap(t) {
  for (const b of G.buttons) {
    if (!hit(b, t)) continue;
    // el titulo se come el toque en silencio hasta completar la secuencia;
    // ya destapado, cada toque suelto cambia de vidrio
    if (b.label === 'TINT') {
      if (Tint.tap()) { Sfx.init(); Sfx.resume(); Sfx.level(); buzz(20); }
      return true;
    }
    Menu.syncTo(b.label);            // el toque manda: el cursor lo sigue
    return activate(b.label);
  }
  return false;
}

// Cortar el modo demo: se vuelve al menu con el campo limpio.
function quitAttract() {
  G.attract = false;
  Sfx.quiet = false;                  // la demo estaba callada; el menu vuelve a sonar
  G.ship = null;
  G.meteors.length = 0; G.bullets.length = 0; G.pickups.length = 0;
  G.shards.length = 0; G.rings.length = 0;
  Sfx.engine(false);
}

function updateInitials(nav) {
  if (nav.move) {
    hs.initials[hs.slot] = (hs.initials[hs.slot] + nav.move + 26) % 26;
    Sfx.ui();
  }
  if (nav.select) {
    hs.slot++;
    Sfx.ui(); buzz(15);
    if (hs.slot > 2) { hs.slot = 2; commitInitials(); }
  }
}

/* ============================ loop ============================ */
let last = performance.now();
let deadHold = 0;
let navScreen = null;

// ---- tope de cuadros del DMG (§2.1) ----
// El navegador llama tan seguido como refresque el panel; aca se deja pasar
// como mucho un cuadro por periodo de Game Boy y el resto se descarta entero
// (ni logica ni dibujo: el cuadro no existe). La tolerancia es medio intervalo
// del panel, medido cuadro a cuadro, y es lo que decide el reparto: una
// pantalla de 60 Hz (16.667 ms, apenas mas rapida que los 16.743 del DMG)
// dibuja siempre, sin tironear cada tantos segundos por redondeo, y una de 120
// deja pasar uno de cada dos. En una que no sea multiplo (144) cae en el
// divisor mas cercano y queda parejo, que se ve mejor que clavar 59.7275 a
// costa de tironear. El reloj del juego sigue siendo el de verdad, asi que el
// tope cambia como se ve, no a que velocidad va la nave.
const GB_FRAME = CFG.gbHz > 0 ? 1000 / CFG.gbHz : 0;
let vsync = GB_FRAME || 16.7;          // intervalo del panel: minimo con subida lenta
let rawLast = last;

function frame(now) {
  requestAnimationFrame(frame);        // primero: si el cuadro se descarta, el bucle sigue

  const step = now - rawLast;
  rawLast = now;
  if (step > 0) vsync = Math.min(step, vsync + 0.2);
  if (GB_FRAME && now - last < GB_FRAME - vsync * 0.5) return;

  let dt = (now - last) / 1000;
  last = now;
  dt = clamp(dt, 0, 0.05);              // sin pausa: si la app pierde foco, se reanuda seco (§14)

  Link.tick(now);                       // suelta los motores si el celular dejo de latir
  Input.update();
  Tint.tick(dt);
  const tap = Input.consumeTap();
  G.buttons = [];
  Menu.rows = [];                       // las repone el dibujo de esta pantalla

  // Al cambiar de pantalla hay que soltar todo antes de que la nueva escuche
  if (screen !== navScreen) { navScreen = screen; Nav.armAfterRelease(); }
  const nav = Nav.update(dt);

  // orientacion (§12.7)
  if (H > W && screen !== SCREEN.ROTATE) { prevScreen = screen; screen = SCREEN.ROTATE; }
  else if (H <= W && screen === SCREEN.ROTATE) { screen = prevScreen; Input.lastTouch = now; }

  if (screen === SCREEN.PLAY) updatePlay(dt * G.timeScale);
  else if (screen === SCREEN.ROTATE && prevScreen === SCREEN.PLAY) updatePlay(dt * G.timeScale); // no hay pausa (§14)
  else if (screen === SCREEN.MENU) {
    if (G.attract) updatePlay(dt * G.timeScale);
    else if (now - Input.lastTouch > CFG.attractDelay * 1000) startGame(true);
  } else if (screen === SCREEN.INITIALS) updateInitials(nav);
  else if (screen === SCREEN.DEAD) {
    deadHold += dt;
    if (hs.pending && deadHold > 1.5) { hs.initials = [0, 0, 0]; hs.slot = 0; screen = SCREEN.INITIALS; }
  }
  if (screen !== SCREEN.DEAD) deadHold = 0;

  // ---------- render ----------
  ctx.setTransform(PIX, 0, 0, PIX, 0, 0);
  ctx.fillStyle = CFG.bg;
  ctx.fillRect(0, 0, W, H);

  const worldVisible = screen === SCREEN.PLAY || (screen === SCREEN.MENU && G.attract);
  if (worldVisible) renderWorld();
  // el campo congelado queda de fondo, apagandose
  if (screen === SCREEN.DEAD || screen === SCREEN.INITIALS) VRAM.fade(0.05);

  if (screen !== SCREEN.SCORES && screen !== SCREEN.ROTATE) {
    // el apagado del modo demo y el destello de nivel/dano se aplican sobre la
    // intensidad, antes de cuantizar: mezclarlos despues inventaria medios tonos
    const dim   = (screen === SCREEN.MENU && G.attract) ? 0.55 : 1;
    const boost = (G.flash > 0 && worldVisible) ? clamp(G.flash, 0, 1) * 0.2 : 0;
    VRAM.blit(dim, boost);
    ctx.setTransform(1, 0, 0, 1, 0, 0);            // 1:1, sin remuestrear
    ctx.drawImage(trail, 0, 0);
    ctx.setTransform(PIX, 0, 0, PIX, 0, 0);
  }

  // la interfaz se dibuja 1:1 contra el buffer del LCD, en pixeles enteros
  uiBegin();
  if (screen === SCREEN.PLAY) drawHud();
  else if (screen === SCREEN.MENU) drawMenu();
  else if (screen === SCREEN.DEAD) drawDead();
  else if (screen === SCREEN.INITIALS) drawInitials();
  else if (screen === SCREEN.SCORES) drawScores();
  else if (screen === SCREEN.ROTATE) drawRotate();
  uiEnd();

  // la escena de baja resolucion pasa por el LCD: paleta, trama y reticula
  LCD.present();

  // ---------- navegacion con los motores ----------
  // Va despues del dibujo porque es el dibujo el que publica las filas.
  if (nav.move || nav.select) {
    Input.lastTouch = now;
    if (screen === SCREEN.MENU && G.attract) {
      quitAttract();                     // tocar un motor tambien corta la demo
    } else if (screen === SCREEN.MENU || screen === SCREEN.DEAD || screen === SCREEN.SCORES) {
      if (nav.move && Menu.move(nav.move)) Sfx.ui();
      if (nav.select) { buzz(15); activate(Menu.chosen()); }
    }
  }

  // ---------- taps de menu ----------
  if (tap) {
    if (screen === SCREEN.PLAY) {
      handleHudTap(tap);
    } else if (screen === SCREEN.MENU) {
      Input.lastTouch = now;
      // el boton de sonido gana al toque que corta la demo
      if (G.attract) {
        if (!handleHudTap(tap)) {
          // ...y el titulo tambien: el toque corta la demo Y cuenta para el
          // tinte (§21.1). Si no contara, con la demo puesta harian falta
          // cinco toques en vez de cuatro y el easter egg no saldria nunca.
          if (hit(tintBox(), tap) && Tint.tap()) { Sfx.init(); Sfx.resume(); Sfx.level(); buzz(20); }
          quitAttract();
        }
      } else handleMenuTap(tap);
    } else if (screen === SCREEN.SCORES || screen === SCREEN.DEAD) {
      handleMenuTap(tap);
    }
  }
}

/* ==================== enlace TV <-> celular (§20) ====================
   Misma URL en los dos aparatos. La TV se abre normal y muestra un codigo
   de 6 digitos; el celular se abre con ?ctrl, escribes ese codigo y se
   conecta solo. El handshake pasa por el servidor publico de PeerJS y los
   datos del control van por WebRTC: si los dos aparatos estan en la misma
   red el trafico es directo, y si no lo estan (celular con datos, tele por
   ethernet, cada uno en su casa) sale por los STUN/TURN de ICE. No hace
   falta LAN comun, hace falta internet en los dos lados.
   El codigo es el mismo entre recargas: se guarda y con el viaja el top 10
   (§12.7), asi que recargar la tele no rompe el enlace ni borra la tabla.
   El celular manda las coordenadas normalizadas de sus dedos y la TV las
   mete en Input.pointers: para el juego es identico a tocar la pantalla.
   El codigo NO se dibuja aca: el modulo solo publica su estado con status()
   y las pantallas de menu lo pintan en el canvas, asi pasa por el LCD y
   desaparece durante la partida (§20.2).
   ==================================================================== */
const Link = (() => {
  const IS_CTRL = new URLSearchParams(location.search).has('ctrl');
  const PREFIX  = 'vdrift-';
  const LS_KEY  = 'vdrift.lastcode';   // celular: ultimo codigo tecleado
  const LS_TV   = 'vdrift.tvcode';     // tele: su codigo, estable entre recargas
  // STUN descubre la IP publica y alcanza para casi todas las redes; TURN es
  // el plan B cuando el NAT no deja pasar nada directo (datos moviles con
  // CGNAT, wifi de hotel, redes de empresa) y hace de relevo. Sin esto el
  // enlace solo era fiable dentro de la misma LAN.
  const ICE = {
    iceServers: [
      { urls: ['stun:stun.l.google.com:19302', 'stun:stun1.l.google.com:19302',
               'stun:stun.cloudflare.com:3478'] },
      { urls: ['turn:openrelay.metered.ca:80', 'turn:openrelay.metered.ca:443',
               'turns:openrelay.metered.ca:443?transport=tcp'],
        username: 'openrelayproject', credential: 'openrelayproject' },
      { urls: ['turn:staticauth.openrelay.metered.ca:80'],
        username: 'openrelayproject', credential: 'openrelayproject' }
    ]
  };
  let peer = null, conn = null, myCode = '', tries = 0;
  const state = { code: '', linked: false, linkedAt: 0, error: '' };

  const el = (tag, id, parent) => {
    const e = document.createElement(tag);
    if (id) e.id = id;
    (parent || document.body).appendChild(e);
    return e;
  };
  const digits6 = () => String(Math.floor(100000 + Math.random() * 900000));
  const ctrlUrl = () => location.origin + location.pathname + '?ctrl';
  const remember = c => { try { localStorage.setItem(LS_TV, c); } catch (e) {} };

  // El codigo de la tele se genera una sola vez y queda guardado. Se pide
  // antes de abrir el peer porque el top 10 cuelga de el (§12.7).
  function deviceCode() {
    if (myCode) return myCode;
    let saved = '';
    try { saved = localStorage.getItem(LS_TV) || ''; } catch (e) {}
    myCode = /^\d{6}$/.test(saved) ? saved : digits6();
    if (myCode !== saved) remember(myCode);
    return myCode;
  }

  /* ------------------------- lado PANTALLA (TV) ------------------------- */
  function unlink() { conn = null; clearRemote(); state.linked = false; }

  function openPeer() {
    peer = new Peer(PREFIX + deviceCode(), { config: ICE });

    peer.on('open', () => { state.code = myCode; state.error = ''; });

    peer.on('error', err => {
      // el id guardado ya lo tiene otra pantalla abierta: se saca uno nuevo,
      // se guarda y el top 10 se muda con el
      if (err.type === 'unavailable-id' && tries++ < 6) {
        peer.destroy();
        myCode = digits6();
        remember(myCode);
        Store.rekey(myCode);
        openPeer();
        return;
      }
      state.code = '';
      state.error = err.type;
    });

    peer.on('connection', c => {
      if (conn) { try { conn.close(); } catch (e) {} }
      conn = c;
      c.on('open', () => {
        state.linked = true;
        state.linkedAt = performance.now();
        state.error = '';
        sendAspect();
        Sfx.init(); Sfx.resume();
        Input.lastTouch = performance.now();
      });
      c.on('data', onData);
      c.on('close', unlink);
      c.on('error', unlink);
    });
  }

  function sendAspect() { if (conn && conn.open) conn.send({ t: 'ar', ar: W / H }); }

  // los punteros remotos viven con llaves de texto para no chocar con el
  // puntero del Magic Remote ni con dedos locales
  function clearRemote() {
    for (const k of [...Input.pointers.keys()]) {
      if (typeof k === 'string' && k[0] === 'r') Input.pointers.delete(k);
    }
  }

  // Si el celular deja de latir con dedos apoyados es que se durmio, se fue a
  // segundo plano o la red se trabo. Sin esto los motores se quedan encendidos
  // hasta reiniciar el juego, porque el ultimo estado recibido vale para
  // siempre (§4.3).
  let heldSince = 0;
  function tick(now) {
    if (!heldSince) return;
    if (now - heldSince > CFG.remoteTimeout * 1000) { clearRemote(); heldSince = 0; }
  }

  function onData(m) {
    if (!m || !m.t) return;
    if (m.t === 'p') {                     // estado completo de los dedos
      clearRemote();
      for (const p of m.a) Input.pointers.set('r' + p[0], { x: p[1] * W, y: p[2] * H });
      // mientras haya dedos, el celular late; el silencio es lo que se vigila
      heldSince = m.a.length ? performance.now() : 0;
    } else if (m.t === 't') {              // tap: sirve para los menus
      Input.tapPos = { x: m.x * W, y: m.y * H };
      Input.lastTouch = performance.now();
      Sfx.init(); Sfx.resume();
    }
  }

  function screenMode() {
    if (!window.Peer) { state.error = 'no internet'; return; }
    openPeer();
    window.addEventListener('resize', () => setTimeout(sendAspect, 150));
  }

  /* ------------------------ lado CONTROL (celular) ---------------------- */
  function controllerMode() {
    cv.style.display = 'none';

    const root  = el('div', 'ctrl');
    const title = el('h1', null, root);      title.textContent = 'MY SPACE DRIFT';
    const hint  = el('p', null, root);       hint.textContent  = 'code shown on the tv';
    const input = el('input', 'ctrl-code', root);
    const msg   = el('p', 'ctrl-msg', root);
    input.type = 'text'; input.inputMode = 'numeric'; input.maxLength = 6;
    input.placeholder = '000000'; input.autocomplete = 'off';
    msg.textContent = 'wi-fi, ethernet or mobile data';

    if (!window.Peer) { msg.textContent = 'no internet — cannot pair'; input.disabled = true; return; }

    const pad  = el('div', 'ctrl-pad');
    pad.hidden = true;
    const rect = el('div', null, pad); rect.className = 'pad';
    const halves = [el('div', null, rect), el('div', null, rect)];
    halves[0].className = halves[1].className = 'half';
    halves[0].textContent = 'L'; halves[1].textContent = 'R';
    let aspect = 16 / 9;

    function layoutPad() {
      const w = window.innerWidth, h = window.innerHeight;
      const useW = Math.min(w, h * aspect);
      rect.style.width  = useW + 'px';
      rect.style.height = (useW / aspect) + 'px';
    }
    window.addEventListener('resize', layoutPad);
    window.addEventListener('orientationchange', () => setTimeout(layoutPad, 150));

    const pts = new Map();
    const sendPts = () => {
      if (!conn || !conn.open) return;
      conn.send({ t: 'p', a: [...pts.entries()].map(([i, p]) => [i, p.x, p.y]) });
      halves[0].classList.toggle('on', [...pts.values()].some(p => p.x < 0.5));
      halves[1].classList.toggle('on', [...pts.values()].some(p => p.x >= 0.5));
    };
    const norm = e => {
      const r = rect.getBoundingClientRect();
      return {
        x: clamp((e.clientX - r.left) / r.width,  0, 0.999),
        y: clamp((e.clientY - r.top)  / r.height, 0, 0.999)
      };
    };

    rect.addEventListener('pointerdown', e => {
      rect.setPointerCapture && rect.setPointerCapture(e.pointerId);
      const p = norm(e);
      pts.set(e.pointerId, p);
      if (conn && conn.open) conn.send({ t: 't', x: p.x, y: p.y });
      sendPts();
      e.preventDefault();
    }, { passive: false });
    rect.addEventListener('pointermove', e => {
      if (!pts.has(e.pointerId)) return;
      pts.set(e.pointerId, norm(e));
      sendPts();
    }, { passive: false });
    const up = e => { if (pts.delete(e.pointerId)) sendPts(); };
    for (const t of ['pointerup', 'pointercancel']) {
      rect.addEventListener(t, up);
      window.addEventListener(t, up);        // por si el up cae fuera del pad
    }
    rect.addEventListener('lostpointercapture', up);
    window.addEventListener('touchend', e => { if (e.touches && !e.touches.length && pts.size) { pts.clear(); sendPts(); } }, { passive: true });

    // Soltar todo y avisarle a la TV. Bloquear la pantalla o cambiar de app
    // dispara visibilitychange y muchas veces no dispara blur: sin esto, el
    // celular deja el dedo apretado del otro lado y la TV nunca se entera.
    const releasePad = () => { if (pts.size) { pts.clear(); sendPts(); } };
    window.addEventListener('blur', releasePad);
    window.addEventListener('pagehide', releasePad);
    document.addEventListener('visibilitychange', () => { if (document.hidden) releasePad(); });

    // Latido: mientras haya un dedo apoyado se reenvia el estado. Si el celular
    // se duerme o la red se traba, el silencio es lo que le permite a la TV
    // darse cuenta y soltar los motores sola.
    setInterval(() => { if (pts.size) sendPts(); }, CFG.remoteBeat * 1000);

    let lastCode = '', retry = 0, wait = 3000;

    function connect(code) {
      lastCode = code;
      clearTimeout(retry);
      msg.textContent = 'connecting…';
      input.disabled = true;
      peer = new Peer({ config: ICE });
      peer.on('open', () => {
        conn = peer.connect(PREFIX + code, { reliable: true });
        conn.on('open', () => {
          try { localStorage.setItem(LS_KEY, code); } catch (e) {}
          root.hidden = true; pad.hidden = false;
          wait = 3000;
          layoutPad();
          navigator.wakeLock && navigator.wakeLock.request('screen').catch(() => {});
        });
        conn.on('data', m => { if (m && m.t === 'ar') { aspect = m.ar; layoutPad(); } });
        conn.on('close', () => reset('disconnected', true));
        conn.on('error', () => reset('connection failed', true));
      });
      peer.on('error', err => {
        const gone = err.type === 'peer-unavailable';
        reset(gone ? 'no tv with that code' : 'error — ' + err.type, gone);
      });
    }

    // El codigo de la tele ya no cambia al recargarla, asi que cuando se cae
    // el enlace el celular vuelve solo: reintenta el mismo codigo hasta que
    // la pantalla este de nuevo arriba. Si el jugador toca el campo, manda el.
    function reset(why, again) {
      try { peer && peer.destroy(); } catch (e) {}
      peer = null; conn = null; pts.clear();
      root.hidden = false; pad.hidden = true;
      input.disabled = false;
      msg.textContent = why;
      clearTimeout(retry);
      if (again && lastCode) {
        input.value = lastCode;
        retry = setTimeout(() => connect(lastCode), wait);
        wait = Math.min(Math.round(wait * 1.6), 15000);   // la tele puede tardar en volver
      } else {
        input.value = '';
      }
    }

    input.addEventListener('focus', () => { clearTimeout(retry); lastCode = ''; });
    input.addEventListener('input', () => {
      clearTimeout(retry);
      input.value = input.value.replace(/\D/g, '').slice(0, 6);
      if (input.value.length === 6) { input.blur(); connect(input.value); }   // conecta solo
    });

    let saved = '';
    try { saved = localStorage.getItem(LS_KEY) || ''; } catch (e) {}
    if (/^\d{6}$/.test(saved)) { input.value = saved; connect(saved); }
    else setTimeout(() => input.focus(), 300);
  }

  return {
    isController: IS_CTRL,
    start() { IS_CTRL ? controllerMode() : screenMode(); },
    code: deviceCode,          // el top 10 cuelga de este codigo (§12.7)
    url: ctrlUrl,
    status() { return state; },
    tick
  };
})();

/* ============================ arranque ============================ */
resize();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});   // offline; se ignora si no existe
}
Store.bind(Link.code());                 // la tabla es la de este codigo (§12.7)
Store.load().then(l => { hs.list = l; });
Prefs.loadMuted().then(m => { if (m) Sfx.setMuted(true); });
Prefs.loadTint().then(n => { if (n) Tint.set(n); });      // el vidrio de la ultima vez
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { Sfx.engine(false); releaseAll(); }
  last = rawLast = performance.now();
});
window.addEventListener('load', () => Link.start());
if (!Link.isController) requestAnimationFrame(frame);   // el celular-control no renderiza el juego
</script>
</body>
</html>
