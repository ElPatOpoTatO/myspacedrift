  const p = m.pts;
  for (let i = 0, j = p.length - 1; i < p.length; j = i++) {
    if ((p[i].y > ly) !== (p[j].y > ly) &&
        lx < (p[j].x - p[i].x) * (ly - p[i].y) / (p[j].y - p[i].y) + p[i].x) inside = !inside;
  }
  return inside;
}
function circleHitsRock(px, py, r, m) {
  if (pointInRock(px, py, m)) return true;
  const dx = px - m.x, dy = py - m.y;
  const ca = Math.cos(-m.a), sa = Math.sin(-m.a);
  const lx = dx * ca - dy * sa, ly = dx * sa + dy * ca;
  const p = m.pts;
  for (let i = 0; i < p.length; i++) {
    const a = p[i], b = p[(i + 1) % p.length];
    const vx = b.x - a.x, vy = b.y - a.y;
    const t = clamp(((lx - a.x) * vx + (ly - a.y) * vy) / (vx * vx + vy * vy || 1), 0, 1);
    if (Math.hypot(lx - (a.x + vx * t), ly - (a.y + vy * t)) < r) return true;
  }
  return false;
}

/* ============================ modo demo (§12.2) ============================ */
// Nave gobernada por la maquina: esquiva, dispara, parte rocas y muere.
function botControl(s) {
  if (!s.alive) return { left: false, right: false };
  let threat = null, threatT = 99, target = null, targetD = 1e9;
  for (const m of G.meteors) {
    const dx = m.x - s.x, dy = m.y - s.y;
    const d = Math.hypot(dx, dy);
    const rvx = m.vx - s.vx, rvy = m.vy - s.vy;
    const vv = rvx * rvx + rvy * rvy;
    let t = vv > 1e-3 ? -(dx * rvx + dy * rvy) / vv : -1;
    if (t > 0 && t < 2.2) {
      const cd = Math.hypot(dx + rvx * t, dy + rvy * t);
      if (cd < m.r + 46 && t < threatT) { threatT = t; threat = m; }
    }
    if (d < targetD) { targetD = d; target = m; }
  }
  // Con avance constante, "ambos" ya no acelera: frena. El bot lo usa solo para
  // quedarse encarando una roca mientras dispara.
  let want, hold = false;
  if (threat && threatT < 1.3) {
    want = Math.atan2(s.y - threat.y, s.x - threat.x);  // huir a toda velocidad
    hold = false;
  } else if (target && targetD < 320) {
    want = Math.atan2(target.y - s.y, target.x - s.x);  // encarar y disparar
    hold = targetD < 170;                                // frena si ya la tiene encima
  } else {
    want = Math.atan2(H / 2 - s.y, W / 2 - s.x);
    hold = false;
  }
  return steerTo(s, want, hold);
}

// Girar hacia un rumbo con los motores del jugador, sin nada que el jugador no
// tenga. Lo usan la demo y la entrada de cada partida. Mira al angulo en que va
// a quedar el giro si suelta ahora, no al de este instante: sin eso oscila.
// Ya encarada, 'hold' deja los dos motores puestos, que es el freno; 'dead' es
// cuanto se admite de desvio antes de considerarla encarada.
function steerTo(s, want, hold, dead) {
  const aEff = s.a + s.av * rotTau();
  const d = ((want - aEff + Math.PI) % TAU + TAU) % TAU - Math.PI;
  if (Math.abs(d) < (dead === undefined ? 0.18 : dead)) return { left: !!hold, right: !!hold };
  return { left: d < 0, right: d > 0 };
}

/* ------------------------- carteles de la demo (§12.2) -------------------------
   La demo elegida en el menu tiene que ENSENAR, no solo verse bonita. Lo hace
   con dos cosas a la vez: abajo se enciende el motor que la maquina esta
   apretando en ese mismo instante — la posicion de la etiqueta es la misma que
   la del dedo en el mando, asi que se lee sin traducir — y encima un cartel
   cuenta de a UNA regla.
   El orden no es decorativo: primero que hay alguien volando, despues como se
   gira, despues que no se frena del todo, y recien al final los puntos. Es el
   orden en que hacen falta para entender lo que se esta viendo.
   Los renglones se mantienen cortos a proposito: entran en el LCD mas angosto
   (160 puntos) sin salirse del cuadro.
   -------------------------------------------------------------------- */
const Demo = (() => {
  const CARDS = [
    ['THE MACHINE IS FLYING', 'WATCH THE BAR BELOW'],
    ['THE ENGINE NEVER STOPS', 'YOU ONLY STEER'],
    ['ONE SIDE TURNS', 'HOLD IT TO TURN MORE'],
    ['BOTH SIDES BRAKE', 'THE DRIFT KEEPS GOING'],
    ['ANY THRUSTER FIRES', 'TURN TO AIM'],
    ['SMALL ROCKS PAY MORE', 'LEVELS SHRINK THEM'],
    ['GRAB THE PICK UPS', 'SHIELD AND REPAIR'],
    ['TWO HITS END THE RUN', 'TOUCH TO GO BACK'],
  ];
  let i = 0, t = 0;
  return {
    // Solo al entrar desde el menu: si la nave muere, la partida vuelve a
    // empezar pero la explicacion sigue donde iba, que es una sola y continua.
    reset() { i = 0; t = 0; },
    tick(dt) {
      t += dt;
      if (t >= CFG.demoCardTime) { t -= CFG.demoCardTime; i = (i + 1) % CARDS.length; }
    },
    get card() { return CARDS[i]; }
  };
})();

/* ============================ high scores ============================ */
// 'mine' es la fila de la partida que acaba de terminar: es lo unico que separa
// tu record de los otros nueve, que son tres letras iguales a las tuyas. Vive
// solo en memoria y solo hasta la proxima partida, porque marca el renglon de
// esta vuelta, no una identidad guardada.
let hs = { list: [], initials: [0, 0, 0], slot: 0, pending: null, holdT: 0, holdDir: 0, fromRun: false, mine: -1 };
const LETTERS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';

function endRun() {
  const list = Store.cached().slice();
  const entry = { i: 'AAA', s: Math.floor(G.score), l: G.level };
  const qualifies = list.length < CFG.maxScores || entry.s > list[list.length - 1].s;
  hs.pending = qualifies ? entry : null;
  hs.mine = -1;                             // la fila de la partida anterior ya no es la tuya
  screen = SCREEN.DEAD;
}

async function commitInitials() {
  const e = hs.pending;
  e.i = hs.initials.map(i => LETTERS[i]).join('');
  const list = Store.cached().slice();
  list.push(e);
  await Store.save(list);                   // ordena por puntaje, nunca por nivel (§12.6), recorta y firma
  hs.list = Store.cached();
  // La entrada hay que buscarla por valor: al guardar, la tabla se rehace entera
  // (Store.clean crea objetos nuevos), asi que el que se empujo ya no esta.
  hs.mine = hs.list.findIndex(x => x.i === e.i && x.s === e.s && x.l === e.l);
  hs.pending = null;
  hs.fromRun = true;
  screen = SCREEN.SCORES;
}

/* ===================== dibujo: VRAM en pixeles enteros =====================
   El canvas no deja apagar el antialias de los trazos: cualquier diagonal
   dibujada con stroke() reparte la tinta entre dos pixeles y aparecen medios
   tonos. Asi que el mundo NO se dibuja con trazos. Se rasteriza a mano —
   Bresenham para rectas, punto medio para circulos — sobre un buffer de
   intensidad del tamano exacto del LCD, y de ahi sale a la pantalla ya
   cuantizado a la paleta. Cada punto esta prendido o apagado, como en el
   hardware.
   Las coordenadas de entrada siguen siendo px CSS (todo el juego mide en
   px CSS); la conversion a puntos de LCD pasa aca adentro.
   ==================================================================== */
const VRAM = (() => {
  const RGB = CFG.gbPalette.map(h => [1, 3, 5].map(i => parseInt(h.substr(i, 2), 16)));
  let buf = new Float32Array(1), w = 1, h = 1, img = null;

  function resize(nw, nh) {
    w = Math.max(1, nw); h = Math.max(1, nh);
    buf = new Float32Array(w * h);
    img = tctx.createImageData(w, h);
  }
  function clear() { buf.fill(0); }

  // Estela fantasma. 'k' es lo que se apaga en UN cuadro de 60 Hz y 'dt' lo pasa a
  // tiempo real, igual que la friccion de la nave. Apagarla por cuadro y no por
  // tiempo es lo que hacia aparecer rocas de mas: cuando el aparato tironea, la
  // roca salta el doble o el triple entre cuadro y cuadro pero el fantasma se
  // apaga lo mismo, asi que las tres generaciones dejan de tocarse y lo que era
  // un rastro pegado a la roca se lee como dos copias sueltas al lado. Por tiempo,
  // el cuadro largo apaga de mas y no queda nada suelto que confundir con una roca.
  function fade(k, dt) {
    const f = Math.pow(1 - k, dt === undefined ? 1 : dt * 60);
    for (let i = 0; i < buf.length; i++) buf[i] *= f;
  }

  function plot(x, y, v) {
    if (x < 0 || y < 0 || x >= w || y >= h) return;
    const i = y * w + x;
    if (v > buf[i]) buf[i] = v;                 // el trazo mas fuerte manda
  }
  function dot(x, y, v, size) {
    if (!(size > 1)) { plot(x, y, v); return; }
    for (let dy = 0; dy < size; dy++) for (let dx = 0; dx < size; dx++) plot(x + dx, y + dy, v);
  }
  // Un punto suelto en px CSS. 'plot' entra en px de LCD, que es lo que usa el
  // cielo de fondo; el juego mide en px CSS y necesita la conversion.
  function point(x, y, v) { plot(Math.round(x * PIX), Math.round(y * PIX), v); }

  // 'dash' > 0 apaga tramos alternos: es el contorno punteado del escudo.
  function line(ax, ay, bx, by, v, size, dash) {
    let x0 = Math.round(ax * PIX), y0 = Math.round(ay * PIX);
    const x1 = Math.round(bx * PIX), y1 = Math.round(by * PIX);
    const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0);
    const sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
    let err = dx + dy, n = 0;
    for (;;) {
      if (!dash || (n % (dash * 2)) < dash) dot(x0, y0, v, size);
      if (x0 === x1 && y0 === y1) break;
      if (++n > 8192) break;                    // red de seguridad
      const e2 = 2 * err;
      if (e2 >= dy) { err += dy; x0 += sx; }
      if (e2 <= dx) { err += dx; y0 += sy; }
    }
  }

  // Contorno rotado y trasladado: es lo que usan rocas y recolectables.
  function polyAt(pts, x, y, a, close, v, size, dash) {
    const ca = Math.cos(a), sa = Math.sin(a), n = pts.length;
    const px = i => x + pts[i].x * ca - pts[i].y * sa;
    const py = i => y + pts[i].x * sa + pts[i].y * ca;
    for (let i = 0; i < n - 1; i++) line(px(i), py(i), px(i + 1), py(i + 1), v, size, dash);
    if (close !== false && n > 1) line(px(n - 1), py(n - 1), px(0), py(0), v, size, dash);
  }

  // Circulo por punto medio: ocho octantes, sin una sola division.
  function circle(cx, cy, rad, v) {
    const ox = Math.round(cx * PIX), oy = Math.round(cy * PIX);
    let r = Math.round(rad * PIX);
    if (r < 1) { plot(ox, oy, v); return; }
    let x = r, y = 0, err = 1 - r;
    while (x >= y) {
      plot(ox + x, oy + y, v); plot(ox + y, oy + x, v);
      plot(ox - x, oy + y, v); plot(ox - y, oy + x, v);
      plot(ox - x, oy - y, v); plot(ox - y, oy - x, v);
      plot(ox + x, oy - y, v); plot(ox + y, oy - x, v);
      y++;
      if (err < 0) err += 2 * y + 1;
      else { x--; err += 2 * (y - x) + 1; }
    }
  }

  // Vuelca el buffer al canvas de estela ya cuantizado. El nivel 0 sale
  // transparente para no tapar el fondo. 'scale' apaga todo (modo demo) y
  // 'boost' lo levanta (destello de nivel o de dano).
  function blit(scale, boost) {
    const d = img.data, s = scale === undefined ? 1 : scale, b = boost || 0;
    for (let i = 0; i < buf.length; i++) {
      const o = i * 4;
      const q = Math.min(3, Math.round((buf[i] * s + b) * 3));
      if (q <= 0) { d[o + 3] = 0; continue; }
      const c = RGB[q];
      d[o] = c[0]; d[o + 1] = c[1]; d[o + 2] = c[2]; d[o + 3] = 255;
    }
    tctx.putImageData(img, 0, 0);
  }

  return { resize, clear, fade, plot, point, line, polyAt, circle, blit };
})();

/* ========================= cielo de fondo =========================
   Un campo de puntos fijos que titilan, detras de todo. Cada estrella es un
   pixel del LCD y nada mas: se sortean en coordenadas enteras del buffer, no en
   unidades de mundo, asi que miden lo mismo en cualquier pantalla.
   El titileo es una sinusoide lenta que recorre starLo..starHi. Lo que se ve no
   es la sinusoide sino los escalones que cruza al cuantizar (§21): la estrella
   se apaga, aparece en gris oscuro, sube a gris claro y vuelve. Nunca alcanza el
   blanco, que es el tono del trazo, y como VRAM.plot mezcla por maximo, dibujar
   el cielo despues del mundo no puede tapar nada.
   ==================================================================== */
const Stars = (() => {
  let field = [];

  function reset(w, h) {
    const n = Math.round((w * h) / CFG.starDensity);
    field = [];
    for (let i = 0; i < n; i++) {
      field.push({
        x: rndInt(0, w - 1),
        y: rndInt(0, h - 1),
        per: rnd(CFG.starPeriodMin, CFG.starPeriodMax),
        ph: rnd(0, TAU),                     // sin esto el cielo entero latiria al unisono
      });
    }
  }

  function draw() {
    const t = performance.now() / 1000, lo = CFG.starLo, amp = CFG.starHi - lo;
    for (const s of field) {
      VRAM.plot(s.x, s.y, lo + amp * (0.5 + 0.5 * Math.sin(t * TAU / s.per + s.ph)));
    }
  }

  return { reset, draw };
})();

function drawShip(s, x, y) {
  const a = s.a, ca = Math.cos(a), sa = Math.sin(a);
  let v = 1;
  const shielded = s.invuln > 0;
  if (shielded) {
    v = 0.4;                                        // mas apagada mientras dura (§8)
    if (s.invuln < CFG.invulnBlink) v = (Math.sin(s.invuln * 26) > 0) ? 0.7 : 0.34;
  } else if (s.grace > 0 && Math.sin(s.grace * 30) > 0) v = 0.4;
  // La nave que trae el autopiloto se dibuja en gris: en cuatro tonos, no ser
  // el blanco pleno es la diferencia que se nota sin tener que explicarla.
  if (G.entry) v = CFG.entryTone;
  // Y el relevo se ve: al llegar parpadea entera, apagandose de verdad —no
  // atenuandose— unas cuantas veces. Es el aviso de que ya responde.
  if (G.ready > 0) v = Math.sin(G.ready * TAU * CFG.readyHz) > 0 ? 1 : 0;

  const dash = shielded ? 2 : 0;                    // contorno punteado del escudo
  SHIP_SEGS.forEach((seg, i) => {
    if (s.damaged && DAMAGED_HIDE.includes(i)) return;   // dano visible permanente (§3)
    VRAM.line(
      x + seg[0].x * ca - seg[0].y * sa, y + seg[0].x * sa + seg[0].y * ca,
      x + seg[1].x * ca - seg[1].y * sa, y + seg[1].x * sa + seg[1].y * ca,
      v, 1, dash);
  });

  // motores visibles (§3): crucero siempre encendido atras; al frenar,
  // los retro salen por el frente. Girar enciende el motor de ese lado.
  const L2 = CFG.shipLen / 2, Wd2 = CFG.shipWid / 2;
  const tri = (P) => VRAM.polyAt(P, x, y, a, false, v, 1);
  const flame = (side) => tri([
    { x: -L2 + 3, y: side * (Wd2 - 1.5) },
    { x: -L2 - rnd(8, 15), y: side * (Wd2 + rnd(-1, 1.5)) },
    { x: -L2 + 1.5, y: side * (Wd2 + 4) }
  ]);
  const cruise = () => tri([
    { x: -L2 * 0.64, y: -3.0 },              // sale por la muesca de la popa
    { x: -L2 - rnd(4, 10), y: 0 },
    { x: -L2 * 0.64, y: 3.0 }
  ]);
  const retro = (side) => tri([
    { x: L2 * 0.3, y: side * 2.2 },
    { x: L2 + rnd(4, 9), y: side * 4.5 },
    { x: L2 * 0.42, y: side * 6 }
  ]);
  if (s.left && s.right) { retro(-1); retro(1); }
  else {
    cruise();
    if (s.left)  flame(-1);
    if (s.right) flame(1);
  }
}

function drawPickup(p) {
  // El cuerpo del recolectable mide 2.3 puntos de LCD de radio: una figura de
  // cinco por cinco. A esa escala un hexagono y un rombo caen sobre los mismos
  // pixeles, que es por lo que antes no se distinguian. Asi que no se separan
  // por numero de lados sino por tres ejes a la vez, que a cinco pixeles si
  // sobreviven, y sin usar color, que en cuatro tonos no existe (§8):
  //
  //            escudo                   reparacion
  //   forma    redonda, dispersa        recta, plena
  //   giro     orbita                   quieta
  //   ondas    hacia afuera (irradia)   hacia adentro (absorbe)
  //
  const breathe = 1 + Math.sin(p.t * 4.2) * 0.16;
  const R = p.r * breathe;
  const repair = p.kind === 'repair';

  if (repair) {
    // Cruz gruesa alineada a los ejes: el simbolo de salud de toda la vida, y a
    // cinco pixeles se lee de una. Va sin girar a proposito — quieta se
    // distingue mas, y ademas una cruz que gira se convierte en una equis cada
    // cuarto de vuelta y deja de ser una cruz.
    VRAM.line(p.x - R, p.y, p.x + R, p.y, 1, 2);
    VRAM.line(p.x, p.y - R, p.x, p.y + R, 1, 2);
  } else {
    // Nucleo con tres satelites en orbita: redondo, disperso y en movimiento, o
    // sea lo contrario de la cruz en los tres ejes. La orbita es lo que se ve
    // primero aunque el nucleo quede en un solo punto.
    VRAM.point(p.x, p.y, 1);
    const spin = p.t * 1.1;
    for (let k = 0; k < 3; k++) {
      const a = spin + k * TAU / 3;
      VRAM.point(p.x + Math.cos(a) * R * 1.6, p.y + Math.sin(a) * R * 1.6, 1);
    }
  }
  for (let k = 0; k < 3; k++) {
    const ph = ((p.t * 0.75) + k / 3) % 1;
    // ondas que entran hacia adentro en el de reparacion: absorbe, no irradia
    if (repair) VRAM.circle(p.x, p.y, R * (0.6 + (1 - ph) * 2.0), ph * 0.6);
    else        VRAM.circle(p.x, p.y, R * (0.5 + ph * 1.9), (1 - ph) * 0.55);
  }
}

// 'dt' es el del reloj de pared, no el de la partida: el fantasma es del vidrio,
// asi que dura lo mismo aunque la muerte ponga el juego en camara lenta.
function renderWorld(dt) {
  VRAM.fade(CFG.trailFade, dt);                // estela fantasma de LCD (§2)

  for (const m of G.meteors) VRAM.polyAt(m.pts, m.x, m.y, m.a, true, 1, 1);
  // La bala es una raya que tumbea sobre su centro y no se apaga de golpe: se
  // va encogiendo con una curva que arranca lentisima y se cae al final, como
  // si se fuera al vacio (§7.1). Todo el efecto es el exponente: k = 1 - t^n.
  // El tono baja con la misma k, asi que la cuantizacion la lleva de blanco a
  // gris claro, a gris oscuro y a nada, que son los unicos pasos que hay.
  for (const b of G.bullets) {
    const t = clamp(1 - b.life / b.max, 0, 1);
    const k = 1 - Math.pow(t, CFG.bulletFade);
    const half = b.len * k * 0.5;
    const dx = Math.cos(b.a) * half, dy = Math.sin(b.a) * half;
    VRAM.line(b.x - dx, b.y - dy, b.x + dx, b.y + dy, k, k > 0.5 ? 2 : 1);
  }
  for (const p of G.pickups) drawPickup(p);
  for (const d of G.shards) {
    const ca = Math.cos(d.a), sa = Math.sin(d.a), v = clamp(d.life / d.max, 0, 1);
    VRAM.line(
      d.x + d.ax * ca - d.ay * sa, d.y + d.ax * sa + d.ay * ca,
      d.x + d.bx * ca - d.by * sa, d.y + d.bx * sa + d.by * ca, v, 1);
  }
  for (const r of G.rings) VRAM.circle(r.x, r.y, r.r, clamp(r.life / r.max, 0, 1) * 0.8);
  const s = G.ship;
  if (s && G.entry) drawEntryMark(s);
  if (s && s.alive) for (const cpy of shipCopies(s)) drawShip(s, cpy.x, cpy.y);
}

// La escuadra del centro: las cuatro esquinas del sitio adonde el autopiloto
// lleva la nave. Se cierra a medida que llega, asi que se ve venir el momento
// del relevo, y desaparece justo cuando pasa: mientras esta puesta, el mando no
// es del jugador. Va en gris oscuro, que es el tono de lo que no se toca.
function drawEntryMark(s) {
  const cx = W / 2, cy = H / 2;
  const t = clamp(Math.hypot(cx - s.x, cy - s.y) / (CFG.entryBrake * 2), 0, 1);
  const r = CFG.entryMark * (0.5 + t * 0.8);
  const arm = Math.max(3, r * 0.4);
  for (const ex of [-1, 1]) for (const ey of [-1, 1]) {
    VRAM.line(cx + ex * r, cy + ey * r, cx + ex * (r - arm), cy + ey * r, 0.42, 1);
    VRAM.line(cx + ex * r, cy + ey * r, cx + ex * r, cy + ey * (r - arm), 0.42, 1);
  }
}

/* ======================= UI: pixel de Game Boy (§22) =======================
   Nada de esto usa la fuente del sistema ni trazos: cada punto es un fillRect
   sobre coordenadas enteras del LCD, que es la unica forma de que no haya
   antialias. La interfaz se dibuja con el transform en 1:1 contra el buffer
   del LCD (uiBegin), asi que aca 1 unidad = 1 pixel de Game Boy y todo cae
   sobre la rejilla de 8 px del hardware.
   ==================================================================== */
const TONE = CFG.gbPalette;                    // 0 negro .. 3 blanco
const T = CFG.tile;
let LW = 160;                                  // ancho de la pantalla en pixeles de LCD
const LH = () => scene.height;                 // alto: 144 filas, o menos si manda el tope de columnas

function uiBegin() { ctx.setTransform(1, 0, 0, 1, 0, 0); LW = scene.width; }
function uiEnd()   { ctx.setTransform(PIX, 0, 0, PIX, 0, 0); }

// La interfaz se dibuja en puntos de LCD, pero los toques llegan en unidades
// de mundo: las cajas de los botones se guardan convertidas.
function worldBox(x, y, w, h, label) {
  return { x: x / PIX, y: y / PIX, w: w / PIX, h: h / PIX, label };
}
// Margenes seguros del aparato, pasados a pixeles de LCD: SAFE viene en px CSS y la UI
// se dibuja en el buffer. El juego llega al borde fisico; solo el HUD se aparta, para
// que el marcador y el boton de sonido no queden debajo del notch o de la isla.
// El puente CSS -> LCD es PIX/SC: a px CSS constantes, en una pantalla mas alta
// el recorte se come menos filas del LCD.
const cssToLcd = () => PIX / SC;
function safeX() { return Math.round(SAFE.l * cssToLcd()); }
function safeY() { return Math.round(SAFE.t * cssToLcd()); }
function safeW() { return Math.round(SAFE.r * cssToLcd()); }
function hit(b, t) { return t && t.x >= b.x && t.x <= b.x + b.w && t.y >= b.y && t.y <= b.y + b.h; }
// Un boton esta "apretado" mientras haya un dedo encima: es el estado
// resaltado de los menus de la Game Boy y ademas da respuesta al toque.
function pressed(box) {
  for (const p of Input.pointers.values()) if (hit(box, p)) return true;
  return false;
}
const blink = (ms) => Math.sin(performance.now() / (ms || 250)) > 0;

/* Seleccion del menu. Las filas las publica el dibujo (menuBox) porque son las
   que cambian por pantalla; la navegacion las lee despues, cuando ya estan. */
const Menu = {
  sel: 0,
  rows: [],
  layout: null,                                // reparto vertical del menu, lo llena drawMenu
  scoresShown: 0,                              // filas del top 10 que llegaron a entrar
  _key: '',
  // Si cambio el juego de opciones, la seleccion vuelve arriba.
  offer(rows) {
    const key = rows.join('|');
    if (key !== this._key) { this._key = key; this.sel = 0; }
    this.rows = rows;
  },
  move(d) {
    if (this.rows.length < 2) return false;
    this.sel = (this.sel + d + this.rows.length) % this.rows.length;
    return true;
  },
  chosen() { return this.rows[this.sel]; },
  // el toque manda: la fila que se toca pasa a ser la elegida
  syncTo(label) { const i = this.rows.indexOf(label); if (i >= 0) this.sel = i; }
};

/* ---------------------------- fuente bitmap ----------------------------
   5x7 con avance de 6: es lo que entraba en el tile de 8x8 del hardware,
   con 7 px de alto util. Cada glifo se lee en el codigo como el dibujo que es.
   Las minusculas hacen falta de verdad: la URL de emparejamiento lleva una
   ruta sensible a mayusculas y en mayusculas daria 404 al tipearla.
   -------------------------------------------------------------------- */
const Font = (() => {
  const G = {
    ' ': [0, 0, 0, 0, 0, 0, 0],

    C: [0b01110, 0b10001, 0b10000, 0b10000, 0b10000, 0b10001, 0b01110],
    D: [0b11110, 0b10001, 0b10001, 0b10001, 0b10001, 0b10001, 0b11110],
    E: [0b11111, 0b10000, 0b10000, 0b11110, 0b10000, 0b10000, 0b11111],

    H: [0b10001, 0b10001, 0b10001, 0b11111, 0b10001, 0b10001, 0b10001],
    I: [0b01110, 0b00100, 0b00100, 0b00100, 0b00100, 0b00100, 0b01110],
    J: [0b00111, 0b00010, 0b00010, 0b00010, 0b00010, 0b10010, 0b01100],
    K: [0b10001, 0b10010, 0b10100, 0b11000, 0b10100, 0b10010, 0b10001],
    L: [0b10000, 0b10000, 0b10000, 0b10000, 0b10000, 0b10000, 0b11111],

    4: [0b00010, 0b00110, 0b01010, 0b10010, 0b11111, 0b00010, 0b00010],
    5: [0b11111, 0b10000, 0b11110, 0b00001, 0b00001, 0b10001, 0b01110],

    '-': [0b00000, 0b00000, 0b00000, 0b11111, 0b00000, 0b00000, 0b00000],
    '—': [0b00000, 0b00000, 0b00000, 0b11111, 0b00000, 0b00000, 0b00000],
    '.': [0b00000, 0b00000, 0b00000, 0b00000, 0b00000, 0b00000, 0b00100],
    ',': [0b00000, 0b00000, 0b00000, 0b00000, 0b00000, 0b00100, 0b01000],
    ':': [0b00000, 0b00100, 0b00000, 0b00000, 0b00000, 0b00100, 0b00000],
    '/': [0b00001, 0b00010, 0b00010, 0b00100, 0b01000, 0b01000, 0b10000],
    '?': [0b01110, 0b10001, 0b00001, 0b00010, 0b00100, 0b00000, 0b00100],
    '!': [0b00100, 0b00100, 0b00100, 0b00100, 0b00100, 0b00000, 0b00100],
    '+': [0b00000, 0b00100, 0b00100, 0b11111, 0b00100, 0b00100, 0b00000],
    '=': [0b00000, 0b00000, 0b11111, 0b00000, 0b11111, 0b00000, 0b00000],
    '_': [0b00000, 0b00000, 0b00000, 0b00000, 0b00000, 0b00000, 0b11111],
    '#': [0b01010, 0b01010, 0b11111, 0b01010, 0b11111, 0b01010, 0b01010],
    '(': [0b00010, 0b00100, 0b01000, 0b01000, 0b01000, 0b00100, 0b00010],
    ')': [0b01000, 0b00100, 0b00010, 0b00010, 0b00010, 0b00100, 0b01000],
    '×': [0b00000, 0b10001, 0b01010, 0b00100, 0b01010, 0b10001, 0b00000],
    '→': [0b00000, 0b00100, 0b00010, 0b11111, 0b00010, 0b00100, 0b00000],
    '▶': [0b10000, 0b11000, 0b11100, 0b11110, 0b11100, 0b11000, 0b10000],
    '▲': [0b00100, 0b00100, 0b01110, 0b01110, 0b11111, 0b11111, 0b00000],
    '▼': [0b00000, 0b11111, 0b11111, 0b01110, 0b01110, 0b00100, 0b00100],
  };
  const ADV = 6, GW = 5, GH = 7;
  const width = (str, s) => Math.max(0, str.length * ADV - 1) * (s || 1);

  // x,y son la esquina superior izquierda del primer glifo (o el borde que
  // marque align). Todo entero: sin medios pixeles no hay borde suave.
  function draw(str, x, y, s, align, color) {
    s = Math.max(1, Math.round(s || 1));
    let px = Math.round(x);
    if (align === 'center') px = Math.round(x - width(str, s) / 2);
    else if (align === 'right') px = Math.round(x - width(str, s));
    const py = Math.round(y);
    ctx.fillStyle = color || TONE[3];
    for (const ch of str) {
      const g = G[ch] || G[ch.toUpperCase()];
      if (g) {
        for (let r = 0; r < GH; r++) {
          const bits = g[r];
          if (!bits) continue;
          // corridas horizontales: un fillRect por tramo, no uno por punto
          let run = 0;
          for (let c = 0; c <= GW; c++) {
            const on = c < GW && (bits >> (GW - 1 - c)) & 1;
            if (on) run++;
            else if (run) {
              ctx.fillRect(px + (c - run) * s, py + r * s, run * s, s);
              run = 0;
            }
          }
        }
      }
      px += ADV * s;
    }
  }
  return { draw, width, GH, ADV };
})();

// Texto de interfaz. 'tone' es el indice de la paleta: asi se apagaba el texto
// secundario en la Game Boy, con un gris de verdad y no con transparencia.
function text(str, x, y, s, align, tone) {
  Font.draw(str, x, y, s, align, TONE[tone === undefined ? 3 : tone]);
}

/* --------------------------- marcos y botones --------------------------- */
// Cuadro de dialogo (la "window" del hardware): relleno liso, borde de 1 px y
// esquinas recortadas, que es como se arma con tiles.
function winBox(x, y, w, h, inverted) {
  ctx.fillStyle = inverted ? TONE[3] : TONE[0];
  ctx.fillRect(x, y, w, h);
  ctx.fillStyle = inverted ? TONE[0] : TONE[3];
  ctx.fillRect(x + 1, y, w - 2, 1);
  ctx.fillRect(x + 1, y + h - 1, w - 2, 1);
  ctx.fillRect(x, y + 1, 1, h - 2);
  ctx.fillRect(x + w - 1, y + 1, 1, h - 2);
}

// Fila de menu dentro de un cuadro: cursor ▶ parpadeando en la fila elegida,
// y la fila entera en negativo mientras el dedo la aprieta.
function menuRow(label, x, y, w, chosen) {
  const h = 12;
  const box = worldBox(x, y, w, h, label);
  const on = pressed(box);
  if (on) { ctx.fillStyle = TONE[3]; ctx.fillRect(x, y, w, h); }
  if (chosen && !on) text('▶', x + 3, y + 3, 1, 'left', 2 + (blink(320) ? 1 : 0));
  text(label, x + w / 2 + 4, y + 3, 1, 'center', on ? 0 : 3);
  G.buttons.push(box);
}

// Cuadro de menu completo: las filas ya vienen alineadas a la rejilla. Publica
// sus etiquetas en Menu para que la navegacion con los motores sepa que hay.
// 'helpLimit' es hasta donde puede llegar la ayuda de navegacion. Por defecto es
// el borde de abajo, pero el menu le pasa el techo del codigo de enlace: en una
// pantalla baja (§21.2) la ayuda es lo primero que sobra, porque repite lo que
// ya dice la franja de controles.
function menuBox(rows, cx, top, w, helpLimit) {
  const h = 6 + rows.length * 12;
  const x = Math.round(cx - w / 2);
  Menu.offer(rows);
  winBox(x, top, w, h);
  rows.forEach((r, i) => menuRow(r, x + 2, top + 3 + i * 12, w - 4, i === Menu.sel));
  // la ayuda solo si hay donde: en records el cuadro ya va pegado abajo
  if (rows.length > 1 && top + h + 4 + Font.GH <= (helpLimit === undefined ? LH() : helpLimit)) {
    text('L/R — MOVE     BOTH — SELECT', cx, top + h + 4, 1, 'center', 1);
  }
  return top + h;
}

/* ------------------------------- iconos -------------------------------- */
// 8x8, como los objetos del hardware. Se dibujan igual que la fuente.
const ICON = {
  //        ...#....    ..##....    .###.#..    .###..#.
  sound: [0b00010000, 0b00110000, 0b01110100, 0b01110010, 0b01110010, 0b01110100, 0b00110000, 0b00010000],
  mute:  [0b00010000, 0b00110000, 0b01110000, 0b01110101, 0b01110010, 0b01110101, 0b00110000, 0b00010000],
};
function icon(bits, x, y, s, tone) {
  ctx.fillStyle = TONE[tone === undefined ? 3 : tone];
  for (let r = 0; r < 8; r++) {
    let run = 0;
    for (let c = 0; c <= 8; c++) {
      const on = c < 8 && (bits[r] >> (7 - c)) & 1;
      if (on) run++;
      else if (run) { ctx.fillRect(x + (c - run) * s, y + r * s, run * s, s); run = 0; }
    }
  }
}

/* ---------------------------- boton de sonido ---------------------------
   Vive arriba a la derecha en todas las pantallas donde existe. La caja se
   comparte con el pointerdown: durante el juego el dedo que lo aprieta no
   debe encender el motor (§13.2), por eso el area de toque es mas grande que
   el icono y se calcula en un solo lugar.
   -------------------------------------------------------------------- */
const MUTE_SCALE = 2;
const muteIcon = () => ({ x: LW - safeW() - 2 * T - 4, y: safeY() + 4, s: MUTE_SCALE });
function muteBox() {
  const m = muteIcon(), pad = 5;
  return worldBox(m.x - pad, m.y - pad, 8 * m.s + 2 * pad, 8 * m.s + 2 * pad, 'MUTE');
}
function muteActive() {
  return screen === SCREEN.PLAY || screen === SCREEN.MENU || screen === SCREEN.DEMO
      || screen === SCREEN.DEAD || screen === SCREEN.SCORES || screen === SCREEN.LINK;
}
function drawMuteButton() {
  const m = muteIcon();
  icon(Sfx.muted ? ICON.mute : ICON.sound, m.x, m.y, m.s, Sfx.muted ? 2 : 3);
  G.buttons.push(muteBox());
}

/* ------------------------------ ayudas fijas ----------------------------
   Las pistas van en un solo renglon pegado al borde de abajo y en el mismo
   orden que los controles: el motor izquierdo en la esquina izquierda, el
   freno al medio y el derecho en la derecha. La posicion ES la explicacion,
   asi que ocupan una franja en vez de tres y ademas ensenan donde tocar.
   Si no entran a lo ancho se prueba la version corta, y si tampoco entra no
   se dibuja nada: mejor sin pistas que con las palabras encimadas.
   -------------------------------------------------------------------- */
const HINT_SETS = [
  ['LEFT THRUST', 'BOTH = BRAKE', 'RIGHT THRUST'],
  ['LEFT', 'BRAKE', 'RIGHT'],
];
// Una pista suelta. Encendida se dibuja en negativo, igual que una fila de menu
// con el dedo encima: es el mismo lenguaje del hardware para "esto esta apretado".
function hintLabel(str, x, y, align, tone, on) {
  if (!on) { text(str, x, y, 1, align, tone); return; }
  const w = Font.width(str, 1);
  const px = align === 'left' ? x : align === 'center' ? Math.round(x - w / 2) : Math.round(x - w);
  ctx.fillStyle = TONE[3];
  ctx.fillRect(px - 2, y - 1, w + 4, Font.GH + 2);
  text(str, x, y, 1, align, 0);
}
// live = { left, right, both }: lo usa la demo para encender la etiqueta del
// motor que la maquina tiene apretado ahora mismo. Sin live la franja es fija.
function drawControlHints(y, tone, live) {
  const t = tone === undefined ? 1 : tone;
  const edge = T, gap = 6, cx = LW / 2;
  for (const [l, c, r] of HINT_SETS) {
    const wl = Font.width(l, 1), wc = Font.width(c, 1), wr = Font.width(r, 1);
    const cLeft = cx - wc / 2, cRight = cx + wc / 2;
    if (edge + wl + gap > cLeft) continue;              // el bloque de la izquierda pisa el del medio
    if (cRight + gap > LW - edge - wr) continue;        // ... o el del medio pisa el de la derecha
    hintLabel(l, edge, y, 'left', t, live && live.left);
    hintLabel(c, cx, y, 'center', t, live && live.both);
    hintLabel(r, LW - edge, y, 'right', t, live && live.right);
    return;
  }
}

// Direccion de emparejamiento del celular, repartida en renglones para el ancho
// de AHORA. Vive aparte de quien la dibuja porque drawLink tiene que repartir el
// alto antes de pintar nada: si el reparto supusiera un renglon y la direccion
// saliera en dos, el codigo se comeria la franja de controles (§21.2).
//
// No entra de una sola linea en cualquier pantalla: mide 245 puntos y el LCD no
// pasa de lcdCols, asi que se cortaba por los dos lados justo el renglon que hay
// que tipear en el celular — el peor sitio posible para que falte texto. Cuando
// no entra se parte por el primer '/', que es donde la vista ya corta sola: el
// dominio arriba y el resto abajo.
function linkRows(room) {
  // el protocolo y el index.html sobran para tipear a mano en el celular
  const url = Link.url().replace(/^https?:\/\//, '').replace(/index\.html\?/, '?');
  const cut = url.indexOf('/');
  return (Font.width(url, 1) <= room || cut <= 0) ? [url] : [url.slice(0, cut), url.slice(cut)];
}

/* ------------------------------- pantallas ------------------------------ */
// En pantallas angostas (4:3) el titulo a escala 2 se metia debajo del icono de
// sonido: si no entra dejando libres las esquinas, baja a escala 1. El area del
// tinte usa la misma medida, si no en esas pantallas quedaria mas ancha que el
// titulo que la disimula.
const TITLE = 'MY SPACE DRIFT';
const titleScale = () => (Font.width(TITLE, 2) <= LW - 5 * T ? 2 : 1);

// El titulo es el boton escondido del tinte (§21.1): no se dibuja distinto y,
// mientras el secreto siga sin destapar, tampoco responde al toque suelto, solo
// cuenta. El area se corta antes del boton de sonido, que en pantallas angostas
// le queda encima.
// El area del tinte se disimula debajo del titulo, asi que mide lo que el
// titulo mide DE VERDAD: con el alto apretado drawMenu puede bajarlo a escala 1,
// y preguntarle a titleScale() dejaria la zona de toque mas ancha que lo que se
// ve. Sin argumento (el hit-test) usa la escala del ultimo reparto dibujado.
function tintBox(s) {
  const w = Font.width(TITLE, s || (Menu.layout && Menu.layout.ts) || titleScale());
  const x = Math.round(LW / 2 - w / 2);
  const right = Math.min(x + w, muteIcon().x - 6);   // el boton de sonido manda, se mueva donde se mueva
  return worldBox(x, 0, Math.max(8, right - x), 3 * T, 'TINT');
}

// Las opciones del menu. Viven aca arriba porque el reparto vertical necesita
// saber cuantas filas hay antes de dibujar el cuadro.
const MENU_ROWS = ['PLAY', 'DEMO', 'HIGH SCORES', 'CONNECT PHONE'];

function drawMenu() {
  const cx = LW / 2;

  // Reparto vertical, ANTES de dibujar: el tamano del titulo sale de aca, no al
  // reves. La direccion y el codigo del mando ya no viven en esta pantalla — se
  // mudaron a la suya (§20.3) — y es lo que le devolvio el aire: el cuadro
  // respira en el medio en vez de quedar apretado contra el pie.
  //
  // Con el tope de columnas la pantalla puede quedar en 104 filas (§21.2), y
  // ahi se cede por utilidad y no por gusto:
  //   1. la ayuda de navegacion, que repite lo que ya dice la franja de abajo;
  //   2. el tamano del titulo, que es adorno.
  // El cuadro de opciones no cede nunca: es lo unico que esta pantalla resuelve.
  const hintsY = LH() - 2 - Font.GH - safeY();
  const boxH = 6 + MENU_ROWS.length * 12;
  // Lo que hay que reservar para la ayuda de navegacion: su renglon, el aire de
  // arriba y —esto es lo que faltaba— aire tambien por debajo. Pegada a la
  // franja de controles quedan dos renglones de texto encimados que se leen
  // como un bloque apretado, que es lo que esta pantalla vino a dejar de ser.
  const helpH = 4 + Font.GH + 6;
  let ts, help, boxTop, titleEnd, maxTop;
  for (const [t, h] of [[titleScale(), true], [titleScale(), false], [1, false]]) {
    ts = t; help = h;
    titleEnd = T + Font.GH * ts + 5;
    maxTop = hintsY - 4 - (help ? helpH : 0) - boxH;
    // Sin el codigo debajo, el sitio libre es todo el que va del titulo al pie:
    // el cuadro se planta en el medio de ese hueco, nunca mas arriba de 5*T
    // (donde caia siempre) ni mas abajo de lo que deja la franja de controles.
    boxTop = Math.min(Math.max(5 * T, Math.round((titleEnd + maxTop) / 2)), maxTop);
    if (boxTop >= titleEnd) break;
  }

  const tw = Font.width(TITLE, ts);
  text(TITLE, cx, T, ts, 'center', 3);
  G.buttons.push(tintBox(ts));
  ctx.fillStyle = TONE[2];
  ctx.fillRect(Math.round(cx - tw / 2), T + Font.GH * ts + 3, tw, 1);
  if (Tint.osd > 0) text('TINT ' + Tint.name, cx, 3 * T + 6, 1, 'center', 2);

  Menu.layout = { boxTop, boxH, hintsY, help, ts, titleEnd };   // lo publica el dibujo, como las filas
  menuBox(MENU_ROWS, cx, boxTop, 112, help ? hintsY - 2 : 0);
  if (G.attract) text('DEMO', T / 2, T / 2, 1, 'left', 2);
  drawControlHints(hintsY, 1);
  drawMuteButton();
}

/* La demo elegida: es la pantalla de juego entera — mismo marcador, mismo
   sonido, mismo campo a plena luz — y encima la capa que explica. Nada de esto
   se dibuja en la demo de fondo del menu, que tiene que quedar detras de las
   opciones y no competir con ellas. */
function drawDemo() {
  const cx = LW / 2;
  const hintY = LH() - 2 - Font.GH - safeY();
  const s = G.ship;
  const L = !!(s && s.left), R = !!(s && s.right);

  drawHud();                                     // marcador y nivel: la demo muestra el juego completo
  // El marcador manda en la primera fila. En un LCD angosto SCORE llega hasta el
  // centro, asi que el rotulo baja una fila entera en vez de encimarsele.
  const hudRow = safeY() + T / 2;
  const scoreEnd = safeX() + T / 2 + Font.width('SCORE 000000', 1);
  const y0 = (cx - Font.width('DEMO', 1) / 2 - 6 > scoreEnd) ? hudRow : hudRow + 9;
  text('DEMO', cx, y0, 1, 'center', blink(420) ? 3 : 2);
  text('TOUCH TO EXIT', cx, y0 + 9, 1, 'center', 1);

  const [a, b] = Demo.card;
  const w = Math.min(LW - 2 * T, Math.max(120, Math.max(Font.width(a, 1), Font.width(b, 1)) + 10));
  const h = 6 + 2 * 9;
  const top = hintY - 4 - h;
  winBox(Math.round(cx - w / 2), top, w, h);
  text(a, cx, top + 4, 1, 'center', 3);
  text(b, cx, top + 13, 1, 'center', 2);

  // la franja de siempre, pero viva: se enciende el motor que la maquina aprieta
  drawControlHints(hintY, 2, { left: L && !R, right: R && !L, both: L && R });
}

function drawHud() {
  // franja de estado: es la window layer de la Game Boy, arriba y fija
  text('SCORE ' + String(Math.floor(G.score)).padStart(6, '0'), safeX() + T / 2, safeY() + T / 2, 1, 'left', 3);
  text('LV ' + G.level, LW - safeW() - 3 * T - 2, safeY() + T / 2, 1, 'right', 3);
  drawMuteButton();
  if (G.levelBanner > 0 && blink(140)) {
    text('LEVEL ' + G.level, LW / 2, LH() / 2 - 7, 2, 'center', 3);
  }
}

/* GAME OVER. Antes ponia cada cosa en una fila fija de la rejilla — el titulo en
   3*T, el cuadro en 10*T — y eso solo cerraba con las 144 filas de la consola:
   en una pantalla ancha, que baja a 104 (§21.2), el cuadro le trepaba a la
   franja de controles y las opciones salian encima de BRAKE. Ademas arrancaba
   con la direccion de emparejamiento en la esquina, que se cruzaba con el
   titulo y no la mira nadie justo cuando acaba de morir: eso vive ahora en su
   propia pantalla (§20.3).
   Asi que se reparte, como el menu: el bloque de abajo se apoya sobre la franja
   y el resto se acomoda en lo que sobra. */
function drawDead() {
  const cx = LW / 2;
  const hintsY = LH() - 2 - Font.GH - safeY();
  const top = safeY() + T / 2;
  // Abajo va el cuadro de opciones o, mientras se decide si hay iniciales que
  // pedir, el aviso de record que lo reemplaza. Los dos ocupan lo mismo y el
  // aviso va centrado en ese hueco: asi el marcador no pega un salto cuando el
  // aviso deja paso al cuadro, y el aviso no queda pegado a la franja de abajo.
  const blockH = 6 + 2 * 12;
  const helpH = 4 + Font.GH + 6;        // con aire por debajo, como en el menu

  // Se cede en el mismo orden que en el menu: primero la ayuda de navegacion
  // (la franja de abajo ya dice lo mismo) y despues el tamano de los numerones.
  let s, help, blockTop, gap;
  for (const [t, h] of [[2, true], [2, false], [1, false]]) {
    s = t; help = h && !hs.pending;
    blockTop = hintsY - 4 - blockH - (help ? helpH : 0);
    gap = Math.floor((blockTop - top - (2 * Font.GH * s + Font.GH)) / 4);
    if (gap >= 4) break;
  }
  gap = Math.max(2, gap);

  let y = top + gap;
  text('GAME OVER', cx, y, s, 'center', 3);
  y += Font.GH * s + gap;
  text(String(Math.floor(G.score)).padStart(6, '0'), cx, y, s, 'center', 3);
  y += Font.GH * s + gap;
  text('LEVEL ' + G.level, cx, y, 1, 'center', 2);

  Menu.layout = { top, gap, s, help, blockTop, blockH, hintsY, statsEnd: y + Font.GH };
  if (hs.pending) text('NEW HIGH SCORE', cx, blockTop + Math.round((blockH - Font.GH) / 2),
                       1, 'center', blink(180) ? 3 : 1);
  else menuBox(['PLAY AGAIN', 'MENU'], cx, blockTop, 112, help ? hintsY - 2 : 0);
  drawControlHints(hintsY, 1);   // recien murio: es cuando mas sirven
  drawMuteButton();
}

/* Pantalla del mando (§20.3). La direccion y el codigo viven aca y solo aca.
   Antes iban al pie del menu y en la esquina del GAME OVER: en el menu se
   comian el alto que necesitaba el cuadro de opciones y en el GAME OVER se
   cruzaban con el titulo, y en las dos aparecian sin que nadie los pidiera.
   Aca los busca quien quiere el mando, que es cuando sirven, y ademas hay sitio
   para contar el estado entero del enlace: conectado, esperando, o el error que
   devolvio el servidor. */
const LINK_TITLE = 'CONNECT PHONE';

function drawLink() {
  const cx = LW / 2;
  const st = Link.status();
  const hintsY = LH() - 2 - Font.GH - safeY();
  const top = safeY() + T;
  const boxH = 6 + 12;                                  // una sola fila: BACK
  const boxTop = hintsY - 4 - boxH;
  const rows = linkRows(LW - 2 * T);                    // la direccion, en uno o dos renglones
  const label = st.error   ? 'LINK - ' + st.error
              : st.linked  ? 'CONTROLLER LINKED'
              :              'AND TYPE THIS CODE';

  // Reparto antes de dibujar, como en el menu. Lo primero que se achica es el
  // titulo, que es adorno; el codigo es lo ultimo, porque es lo unico que hay
  // que leer desde el sillon. Nada se saca: sin la direccion y sin el codigo
  // esta pantalla no sirve para lo unico que hace.
  let ts = 1, cs = 1, gap = 2;
  for (const [t, c] of [[2, 3], [1, 3], [1, 2], [1, 1]]) {
    if (Font.width(LINK_TITLE, t) > LW - 5 * T) continue;   // el boton de sonido manda en esa esquina
    ts = t; cs = c;
    const need = Font.GH * (ts + 1 + rows.length + 1 + cs);
    gap = Math.floor((boxTop - 4 - top - need) / 3);
    if (gap >= 3) break;
  }
  gap = Math.max(2, gap);

  let y = top;
  text(LINK_TITLE, cx, y, ts, 'center', 3);
  y += Font.GH * ts + gap;
  text('OPEN ON YOUR PHONE', cx, y, 1, 'center', 2);
  y += Font.GH;
  for (const r of rows) { text(r, cx, y, 1, 'center', 3); y += Font.GH; }
  y += gap;
  text(label, cx, y, 1, 'center', 2);
  y += Font.GH;
  // Sin codigo todavia (el handshake tarda, o no hay internet) se dibujan los
  // huecos: la pantalla no cambia de forma cuando el numero llega.
  text(st.code || '------', cx, y, cs, 'center', st.code ? 3 : 1);

  Menu.layout = { top, gap, ts, cs, rows: rows.length, boxTop, boxH, hintsY, codeEnd: y + Font.GH * cs };
  menuBox(['BACK'], cx, boxTop, 112);
  drawControlHints(hintsY, 1);
  drawMuteButton();
}

function drawInitials() {
  const cx = LW / 2, cy = LH() / 2;
  text('NEW HIGH SCORE', cx, 2 * T, 2, 'center', 3);
  text('ENTER INITIALS', cx, 5 * T, 1, 'center', 2);
  const s = 4, gap = 8 * s, top = cy - 10;
  for (let i = 0; i < 3; i++) {
    const x = cx + (i - 1) * gap;
    const on = i === hs.slot;
    text(LETTERS[hs.initials[i]], x, top, s, 'center', on ? (blink(200) ? 3 : 1) : 2);
    if (on) {
      ctx.fillStyle = TONE[3];
      ctx.fillRect(Math.round(x - 3 * s), top + 7 * s + 2, 6 * s, 2);
    }
  }
  text('LEFT ▼   RIGHT ▲   BOTH - OK', cx, LH() - 3 * T, 1, 'center', 2);
}

function drawScores() {
  const cx = LW / 2;
  text('HIGH SCORES', cx, T + 4, 2, 'center', 3);
  const list = hs.list.length ? hs.list : Store.cached();
  const rows = hs.fromRun ? ['PLAY AGAIN', 'BACK'] : ['BACK'];
  const boxTop = LH() - 2 - (6 + rows.length * 12);
  const top = 3 * T + 4, rowH = T;
  if (!list.length) text('NO SCORES YET', cx, top + 2 * T, 1, 'center', 2);

  // Cuantas filas entran de arriba del cuadro de botones. Con el tope de
  // columnas (§21.2) la pantalla es ancha y baja, asi que las diez dejan de
  // entrar en una sola columna — pero lo que falta de alto sobra de ancho, que
  // es justo lo que hace falta para partirlas en dos. En dos columnas se cae el
  // nivel, que es lo unico prescindible: la tabla ordena por puntaje, nunca por
  // nivel (§12.6).
  const fit = Math.max(1, Math.floor((boxTop - 4 - top) / rowH));
  const two = fit < list.length;
  const perCol = Math.min(two ? Math.ceil(list.length / 2) : list.length, fit);
  const colW = two ? Math.min(92, Math.floor((LW - 12) / 2)) : 152;
  const x0 = Math.round(cx - (two ? colW + 4 : 76));

  const shown = Math.min(list.length, perCol * (two ? 2 : 1));
  Menu.scoresShown = shown;                    // lo publica el dibujo, como las filas
  for (let i = 0; i < shown; i++) {
    const e = list[i];
    const cl = x0 + Math.floor(i / perCol) * (colW + 8);
    const y = top + (i % perCol) * rowH;
    const tone = i < 3 ? 3 : 2;
    // Tus iniciales laten entre los dos tonos claros: en una tabla de tres letras
    // por fila es lo unico que dice cual sos. El latido es entre el 3 y el 2, no
    // entre encendido y apagado, para que se note sin robarle la vista al top 3.
    const name = i === hs.mine ? (blink(420) ? 3 : 2) : tone;
    text(String(i + 1).padStart(2, ' '), cl, y, 1, 'left', 1);
    text(e.i, cl + 18, y, 1, 'left', name);
    text(String(e.s).padStart(6, '0'), cl + colW - (two ? 0 : 30), y, 1, 'right', tone);
    if (!two) text('LV ' + e.l, cl + colW, y, 1, 'right', 1);
  }
  menuBox(rows, cx, boxTop, 112);
  drawMuteButton();
}

function drawRotate() {
  const cx = LW / 2, cy = LH() / 2;
  text('ROTATE', cx, cy - T, 2, 'center', 3);
  text('YOUR DEVICE', cx, cy + T, 1, 'center', 2);
}

/* ============================ pantallas ============================ */
// Dentro de la partida el unico boton que escucha es el de sonido: el resto de
// la pantalla es motor y no se le puede robar el toque.
function handleHudTap(t) {
  if (!hit(muteBox(), t)) return false;
  Sfx.init(); Sfx.resume(); Sfx.ui();
  Sfx.toggleMute();
  return true;
}

// Lo que hace cada opcion, sin importar si llego por toque o por los motores.
function activate(label) {
  if (!label) return false;
  Sfx.init(); Sfx.resume(); Sfx.ui();
  if (label === 'MUTE') { Sfx.toggleMute(); return true; }
  if (label === 'PLAY') { G.attract = false; startGame('play'); return true; }
  if (label === 'DEMO') { Demo.reset(); startGame('demo'); return true; }
  // Entrando desde el menu no hay partida recien jugada: no hay fila propia que marcar.
  if (label === 'HIGH SCORES') { hs.fromRun = false; hs.mine = -1; screen = SCREEN.SCORES; return true; }
  if (label === 'CONNECT PHONE') { screen = SCREEN.LINK; Input.lastTouch = performance.now(); return true; }
  if (label === 'BACK') { screen = SCREEN.MENU; Input.lastTouch = performance.now(); return true; }
  if (label === 'PLAY AGAIN') { startGame('play'); return true; }
  if (label === 'MENU') { screen = SCREEN.MENU; Input.lastTouch = performance.now(); return true; }
  return false;
}

function handleMenuTap(t) {
  for (const b of G.buttons) {
    if (!hit(b, t)) continue;
    // el titulo se come el toque en silencio hasta completar la secuencia;
    // ya destapado, cada toque suelto cambia de vidrio
    if (b.label === 'TINT') {
      if (Tint.tap()) { Sfx.init(); Sfx.resume(); Sfx.level(); buzz(20); }
      return true;
    }
    Menu.syncTo(b.label);            // el toque manda: el cursor lo sigue
    return activate(b.label);
  }
  return false;
}

// Cortar la demo: se vuelve al menu con el campo limpio. Sirve para las dos, la
// de fondo y la elegida.
function quitAttract() {
  const chosen = G.demo;
  G.attract = false;
  G.demo = false;
  Sfx.quiet = false;                  // la de fondo estaba callada; el menu vuelve a sonar
  G.ship = null; G.entry = false; G.entryT = 0; G.entryD = 0; G.ready = 0;
  G.meteors.length = 0; G.bullets.length = 0; G.pickups.length = 0;
  G.shards.length = 0; G.rings.length = 0;
  Sfx.engine(false);
  // el gesto que corto la demo no debe ademas mover la seleccion al soltarlo:
  // se pidio salir, no navegar
  Nav.armAfterRelease();
  if (chosen) {
    // la elegida ocupaba la pantalla entera: hay que devolver el menu a mano, y
    // con PLAY marcado, que es lo que uno quiere hacer despues de ver como se juega
    screen = SCREEN.MENU;
    Menu.sel = 0;
    Input.lastTouch = performance.now();
  }
}

function updateInitials(nav) {
  if (nav.move) {
    hs.initials[hs.slot] = (hs.initials[hs.slot] + nav.move + 26) % 26;
    Sfx.ui();
  }
  if (nav.select) {
    hs.slot++;
    Sfx.ui(); buzz(15);
    if (hs.slot > 2) { hs.slot = 2; commitInitials(); }
  }
}

/* ============================ loop ============================ */
let last = performance.now();
let deadHold = 0;
let navScreen = null;

// ---- tope de cuadros del DMG (§2.1) ----
// El navegador llama tan seguido como refresque el panel; aca se deja pasar
// como mucho un cuadro por periodo de Game Boy y el resto se descarta entero
// (ni logica ni dibujo: el cuadro no existe). La tolerancia es medio intervalo
// del panel, medido cuadro a cuadro, y es lo que decide el reparto: una
// pantalla de 60 Hz (16.667 ms, apenas mas rapida que los 16.743 del DMG)
// dibuja siempre, sin tironear cada tantos segundos por redondeo, y una de 120
// deja pasar uno de cada dos. En una que no sea multiplo (144) cae en el
// divisor mas cercano y queda parejo, que se ve mejor que clavar 59.7275 a
// costa de tironear. El reloj del juego sigue siendo el de verdad, asi que el
// tope cambia como se ve, no a que velocidad va la nave.
const GB_FRAME = CFG.gbHz > 0 ? 1000 / CFG.gbHz : 0;
let vsync = GB_FRAME || 16.7;          // intervalo del panel: minimo con subida lenta
let rawLast = last;

function frame(now) {
  requestAnimationFrame(frame);        // primero: si el cuadro se descarta, el bucle sigue

  const step = now - rawLast;
  rawLast = now;
  if (step > 0) vsync = Math.min(step, vsync + 0.2);
  if (GB_FRAME && now - last < GB_FRAME - vsync * 0.5) return;

  let dt = (now - last) / 1000;
  last = now;
  dt = clamp(dt, 0, 0.05);              // sin pausa: si la app pierde foco, se reanuda seco (§14)

  Link.tick(now);                       // suelta los motores si el celular dejo de latir
  Input.update();
  Tint.tick(dt);
  const tap = Input.consumeTap();
  G.buttons = [];
  Menu.rows = [];                       // las repone el dibujo de esta pantalla

  // Al cambiar de pantalla hay que soltar todo antes de que la nueva escuche
  if (screen !== navScreen) { navScreen = screen; Nav.armAfterRelease(); }
  const nav = Nav.update(dt);

  // orientacion (§12.7)
  if (H > W && screen !== SCREEN.ROTATE) { prevScreen = screen; screen = SCREEN.ROTATE; }
  else if (H <= W && screen === SCREEN.ROTATE) { screen = prevScreen; Input.lastTouch = now; }

  if (screen === SCREEN.PLAY || screen === SCREEN.DEMO) {
    updatePlay(dt * G.timeScale);
    if (screen === SCREEN.DEMO) Demo.tick(dt);   // los carteles corren con el reloj de pared, no con el del bullet time
  }
  else if (screen === SCREEN.ROTATE && (prevScreen === SCREEN.PLAY || prevScreen === SCREEN.DEMO)) updatePlay(dt * G.timeScale); // no hay pausa (§14)
  else if (screen === SCREEN.MENU) {
    if (G.attract) updatePlay(dt * G.timeScale);
    else if (now - Input.lastTouch > CFG.attractDelay * 1000) startGame('attract');
  } else if (screen === SCREEN.INITIALS) updateInitials(nav);
  else if (screen === SCREEN.DEAD) {
    deadHold += dt;
    if (hs.pending && deadHold > 1.5) { hs.initials = [0, 0, 0]; hs.slot = 0; screen = SCREEN.INITIALS; }
  }
  if (screen !== SCREEN.DEAD) deadHold = 0;

  // ---------- render ----------
  ctx.setTransform(PIX, 0, 0, PIX, 0, 0);
  ctx.fillStyle = CFG.bg;
  ctx.fillRect(0, 0, W, H);

  const worldVisible = screen === SCREEN.PLAY || screen === SCREEN.DEMO || (screen === SCREEN.MENU && G.attract);
  if (worldVisible) renderWorld(dt);
  // el campo congelado queda de fondo, apagandose
  else if (screen === SCREEN.DEAD || screen === SCREEN.INITIALS) VRAM.fade(0.05, dt);
  // menu quieto y tabla de records: no hay mundo, solo cielo. Sin este borrado
  // el buffer repetiria para siempre el ultimo cuadro de la demo.
  else VRAM.clear();
  // El cielo va ultimo: VRAM.plot mezcla por maximo, asi que una estrella no
  // puede pisar un trazo del juego, pero un trazo si tapa una estrella.
  if (screen !== SCREEN.ROTATE) Stars.draw();

  if (screen !== SCREEN.ROTATE) {
    // el apagado del modo demo y el destello de nivel/dano se aplican sobre la
    // intensidad, antes de cuantizar: mezclarlos despues inventaria medios tonos
    const dim   = (screen === SCREEN.MENU && G.attract) ? 0.55 : 1;
    const boost = (G.flash > 0 && worldVisible) ? clamp(G.flash, 0, 1) * 0.2 : 0;
    VRAM.blit(dim, boost);
    ctx.setTransform(1, 0, 0, 1, 0, 0);            // 1:1, sin remuestrear
    ctx.drawImage(trail, 0, 0);
    ctx.setTransform(PIX, 0, 0, PIX, 0, 0);
  }

  // la interfaz se dibuja 1:1 contra el buffer del LCD, en pixeles enteros
  uiBegin();
  if (screen === SCREEN.PLAY) drawHud();
  else if (screen === SCREEN.DEMO) drawDemo();
  else if (screen === SCREEN.MENU) drawMenu();
  else if (screen === SCREEN.DEAD) drawDead();
  else if (screen === SCREEN.INITIALS) drawInitials();
  else if (screen === SCREEN.SCORES) drawScores();
  else if (screen === SCREEN.LINK) drawLink();
  else if (screen === SCREEN.ROTATE) drawRotate();
  uiEnd();

  // la escena de baja resolucion pasa por el LCD: paleta, trama y reticula
  LCD.present();

  // ---------- navegacion con los motores ----------
  // Va despues del dibujo porque es el dibujo el que publica las filas.
  if (nav.move || nav.select) {
    Input.lastTouch = now;
    if (screen === SCREEN.DEMO || (screen === SCREEN.MENU && G.attract)) {
      quitAttract();                     // tocar un motor tambien corta la demo
    } else if (screen === SCREEN.MENU || screen === SCREEN.DEAD || screen === SCREEN.SCORES
            || screen === SCREEN.LINK) {
      if (nav.move && Menu.move(nav.move)) Sfx.ui();
      if (nav.select) { buzz(15); activate(Menu.chosen()); }
    }
  }

  // ---------- taps de menu ----------
  if (tap) {
    if (screen === SCREEN.PLAY) {
      handleHudTap(tap);
    } else if (screen === SCREEN.DEMO) {
      // en la demo la nave no es del jugador, asi que la pantalla entera es
      // "salir": el unico que se salva es el boton de sonido
      Input.lastTouch = now;
      if (!handleHudTap(tap)) quitAttract();
    } else if (screen === SCREEN.MENU) {
      Input.lastTouch = now;
      // el boton de sonido gana al toque que corta la demo
      if (G.attract) {
        if (!handleHudTap(tap)) {
          // ...y el titulo tambien: el toque corta la demo Y cuenta para el
          // tinte (§21.1). Si no contara, con la demo puesta harian falta
          // cinco toques en vez de cuatro y el easter egg no saldria nunca.
          if (hit(tintBox(), tap) && Tint.tap()) { Sfx.init(); Sfx.resume(); Sfx.level(); buzz(20); }
          quitAttract();
        }
      } else handleMenuTap(tap);
    } else if (screen === SCREEN.SCORES || screen === SCREEN.DEAD || screen === SCREEN.LINK) {
      handleMenuTap(tap);
    }
  }
}

/* ==================== enlace TV <-> celular (§20) ====================
   Misma URL en los dos aparatos. La TV se abre normal y muestra un codigo
   de 6 digitos; el celular se abre con ?ctrl, escribes ese codigo y se
   conecta solo. El handshake pasa por el servidor publico de PeerJS y los
   datos del control van por WebRTC: si los dos aparatos estan en la misma
   red el trafico es directo, y si no lo estan (celular con datos, tele por
   ethernet, cada uno en su casa) sale por los STUN/TURN de ICE. No hace
   falta LAN comun, hace falta internet en los dos lados.
   El codigo es el mismo entre recargas: se guarda y con el viaja el top 10
   (§12.7), asi que recargar la tele no rompe el enlace ni borra la tabla.
   El celular manda las coordenadas normalizadas de sus dedos y la TV las
   mete en Input.pointers: para el juego es identico a tocar la pantalla.
   El codigo NO se dibuja aca: el modulo solo publica su estado con status()
   y las pantallas de menu lo pintan en el canvas, asi pasa por el LCD y
   desaparece durante la partida (§20.2).
   ==================================================================== */
const Link = (() => {
  const IS_CTRL = new URLSearchParams(location.search).has('ctrl');
  const PREFIX  = 'vdrift-';
  const LS_KEY  = 'vdrift.lastcode';   // celular: ultimo codigo tecleado
  const LS_TV   = 'vdrift.tvcode';     // tele: su codigo, estable entre recargas
  // STUN descubre la IP publica y alcanza para casi todas las redes; TURN es
  // el plan B cuando el NAT no deja pasar nada directo (datos moviles con
  // CGNAT, wifi de hotel, redes de empresa) y hace de relevo. Sin esto el
  // enlace solo era fiable dentro de la misma LAN.
  const ICE = {
    iceServers: [
      { urls: ['stun:stun.l.google.com:19302', 'stun:stun1.l.google.com:19302',
               'stun:stun.cloudflare.com:3478'] },
      { urls: ['turn:openrelay.metered.ca:80', 'turn:openrelay.metered.ca:443',
               'turns:openrelay.metered.ca:443?transport=tcp'],
        username: 'openrelayproject', credential: 'openrelayproject' },
      { urls: ['turn:staticauth.openrelay.metered.ca:80'],
        username: 'openrelayproject', credential: 'openrelayproject' }
    ]
  };
  let peer = null, conn = null, myCode = '', tries = 0;
  const state = { code: '', linked: false, linkedAt: 0, error: '' };

  const el = (tag, id, parent) => {
    const e = document.createElement(tag);
    if (id) e.id = id;
    (parent || document.body).appendChild(e);
    return e;
  };
  const digits6 = () => String(Math.floor(100000 + Math.random() * 900000));
  const ctrlUrl = () => location.origin + location.pathname + '?ctrl';
  const remember = c => { try { localStorage.setItem(LS_TV, c); } catch (e) {} };

  // El codigo de la tele se genera una sola vez y queda guardado. Se pide
  // antes de abrir el peer porque el top 10 cuelga de el (§12.7).
  function deviceCode() {
    if (myCode) return myCode;
    let saved = '';
    try { saved = localStorage.getItem(LS_TV) || ''; } catch (e) {}
    myCode = /^\d{6}$/.test(saved) ? saved : digits6();
    if (myCode !== saved) remember(myCode);
    return myCode;
  }

  /* ------------------------- lado PANTALLA (TV) ------------------------- */
  function unlink() { conn = null; clearRemote(); state.linked = false; }

  function openPeer() {
    peer = new Peer(PREFIX + deviceCode(), { config: ICE });

    peer.on('open', () => { state.code = myCode; state.error = ''; });

    peer.on('error', err => {
      // el id guardado ya lo tiene otra pantalla abierta: se saca uno nuevo,
      // se guarda y el top 10 se muda con el
      if (err.type === 'unavailable-id' && tries++ < 6) {
        peer.destroy();
        myCode = digits6();
        remember(myCode);
        Store.rekey(myCode);
        openPeer();
        return;
      }
      state.code = '';
      state.error = err.type;
    });

    peer.on('connection', c => {
      if (conn) { try { conn.close(); } catch (e) {} }
      conn = c;
      c.on('open', () => {
        state.linked = true;
        state.linkedAt = performance.now();
        state.error = '';
        Sfx.init(); Sfx.resume();
        Input.lastTouch = performance.now();
      });
      c.on('data', onData);
      c.on('close', unlink);
      c.on('error', unlink);
    });
  }

  // los punteros remotos viven con llaves de texto para no chocar con el
  // puntero del Magic Remote ni con dedos locales
  function clearRemote() {
    for (const k of [...Input.pointers.keys()]) {
      if (typeof k === 'string' && k[0] === 'r') Input.pointers.delete(k);
    }
  }

  // Si el celular deja de latir con dedos apoyados es que se durmio, se fue a
  // segundo plano o la red se trabo. Sin esto los motores se quedan encendidos
  // hasta reiniciar el juego, porque el ultimo estado recibido vale para
  // siempre (§4.3).
  let heldSince = 0;
  function tick(now) {
    if (!heldSince) return;
    if (now - heldSince > CFG.remoteTimeout * 1000) { clearRemote(); heldSince = 0; }
  }

  function onData(m) {
    if (!m || !m.t) return;
    if (m.t === 'p') {                     // estado completo de los dedos
      clearRemote();
      for (const p of m.a) Input.pointers.set('r' + p[0], { x: p[1] * W, y: p[2] * H });
      // mientras haya dedos, el celular late; el silencio es lo que se vigila
      heldSince = m.a.length ? performance.now() : 0;
      if (m.a.length) Input.lastTouch = performance.now();   // el mando en la mano cuenta como toque
    } else if (m.t === 't') {              // tap: sirve para los menus
      Input.tapPos = { x: m.x * W, y: m.y * H };
      Input.lastTouch = performance.now();
      Sfx.init(); Sfx.resume();
    }
  }

  function screenMode() {
    if (!window.Peer) { state.error = 'no internet'; return; }
    openPeer();
  }

  /* ------------------------ lado CONTROL (celular) ---------------------- */
  function controllerMode() {
    cv.style.display = 'none';

    const root  = el('div', 'ctrl');
    const title = el('h1', null, root);      title.textContent = 'MY SPACE DRIFT';
    const hint  = el('p', null, root);       hint.textContent  = 'code on the tv: menu \u2192 connect phone';
    const input = el('input', 'ctrl-code', root);
    const msg   = el('p', 'ctrl-msg', root);
    input.type = 'text'; input.inputMode = 'numeric'; input.maxLength = 6;
    input.placeholder = '000000'; input.autocomplete = 'off';
    msg.textContent = 'wi-fi, ethernet or mobile data';

    if (!window.Peer) { msg.textContent = 'no internet — cannot pair'; input.disabled = true; return; }

    // Dos botones y nada mas, como el mando de cualquier juego: IZQUIERDA y
    // DERECHA, del alto de la pantalla, encendidos mientras el dedo aprieta.
    // Los dos juntos son el freno en la partida y "elegir" en los menus (§4.2),
    // asi que un tercer boton no hace falta.
    const pad = el('div', 'ctrl-pad');
    pad.hidden = true;
    const row = el('div', null, pad);
    row.className = 'row';
    const btns = [0, 1].map(i => {
      const b = el('div', null, row);
      b.className = 'btn';
      const g = document.createElement('b');
      g.textContent = i ? '\u25b6' : '\u25c0';
      b.appendChild(g);
      b.appendChild(document.createTextNode(i ? 'RIGHT' : 'LEFT'));
      return b;
    });
    const tip = el('div', null, pad);
    tip.className = 'tip';
    tip.textContent = 'BOTH \u2014 BRAKE';

    // Cada dedo se manda como un punto en el centro del lado que aprieta. Para
    // la TV es identico a un dedo apoyado en esa mitad de su pantalla (§20), de
    // modo que el juego no se entera de que el mando cambio de forma.
    const pts = new Map();                   // pointerId -> 0 izquierda, 1 derecha
    const sendPts = () => {
      const on = [false, false];
      for (const side of pts.values()) on[side] = true;
      // las luces primero: el boton responde aunque el enlace se haya caido
      btns[0].classList.toggle('on', on[0]);
      btns[1].classList.toggle('on', on[1]);
      if (!conn || !conn.open) return;
      conn.send({ t: 'p', a: [...pts.entries()].map(([i, side]) => [i, side ? 0.75 : 0.25, 0.5]) });
    };
    // El lado sale de la mitad de la pantalla, no del boton que recibio el
    // toque: asi el hueco entre los dos y el margen del aparato tambien cuentan,
    // y arrastrar el dedo de un motor al otro cambia de motor sin levantarlo.
    const sideAt = x => (x < window.innerWidth / 2 ? 0 : 1);

    pad.addEventListener('pointerdown', e => {
      // la captura es una ayuda, no un requisito: si el navegador la rechaza el
      // boton tiene que responder igual, asi que no puede tirar abajo el resto
      try { pad.setPointerCapture(e.pointerId); } catch (err) {}
      pts.set(e.pointerId, sideAt(e.clientX));
      sendPts();
      e.preventDefault();
    }, { passive: false });
    pad.addEventListener('pointermove', e => {
      if (!pts.has(e.pointerId)) return;
      const side = sideAt(e.clientX);
      if (pts.get(e.pointerId) !== side) { pts.set(e.pointerId, side); sendPts(); }
    }, { passive: false });
    const up = e => { if (pts.delete(e.pointerId)) sendPts(); };
    for (const t of ['pointerup', 'pointercancel', 'lostpointercapture']) {
      pad.addEventListener(t, up);
      window.addEventListener(t, up);        // por si el up cae fuera del mando
    }
    window.addEventListener('touchend', e => { if (e.touches && !e.touches.length && pts.size) { pts.clear(); sendPts(); } }, { passive: true });

    // Soltar todo y avisarle a la TV. Bloquear la pantalla o cambiar de app
    // dispara visibilitychange y muchas veces no dispara blur: sin esto, el
    // celular deja el dedo apretado del otro lado y la TV nunca se entera.
    const releasePad = () => { if (pts.size) { pts.clear(); sendPts(); } };
    window.addEventListener('blur', releasePad);
    window.addEventListener('pagehide', releasePad);
    document.addEventListener('visibilitychange', () => { if (document.hidden) releasePad(); });

    // Latido: mientras haya un dedo apoyado se reenvia el estado. Si el celular
    // se duerme o la red se traba, el silencio es lo que le permite a la TV
    // darse cuenta y soltar los motores sola.
    setInterval(() => { if (pts.size) sendPts(); }, CFG.remoteBeat * 1000);

    let lastCode = '', retry = 0, wait = 3000;

    function connect(code) {
      lastCode = code;
      clearTimeout(retry);
      msg.textContent = 'connecting…';
      input.disabled = true;
      peer = new Peer({ config: ICE });
      peer.on('open', () => {
        conn = peer.connect(PREFIX + code, { reliable: true });
        conn.on('open', () => {
          try { localStorage.setItem(LS_KEY, code); } catch (e) {}
          root.hidden = true; pad.hidden = false;
          wait = 3000;
          navigator.wakeLock && navigator.wakeLock.request('screen').catch(() => {});
        });
        conn.on('close', () => reset('disconnected', true));
        conn.on('error', () => reset('connection failed', true));
      });
      peer.on('error', err => {
        const gone = err.type === 'peer-unavailable';
        reset(gone ? 'no tv with that code' : 'error — ' + err.type, gone);
      });
    }

    // El codigo de la tele ya no cambia al recargarla, asi que cuando se cae
    // el enlace el celular vuelve solo: reintenta el mismo codigo hasta que
    // la pantalla este de nuevo arriba. Si el jugador toca el campo, manda el.
    function reset(why, again) {
      try { peer && peer.destroy(); } catch (e) {}
      peer = null; conn = null; pts.clear();
      root.hidden = false; pad.hidden = true;
      input.disabled = false;
      msg.textContent = why;
      clearTimeout(retry);
      if (again && lastCode) {
        input.value = lastCode;
        retry = setTimeout(() => connect(lastCode), wait);
        wait = Math.min(Math.round(wait * 1.6), 15000);   // la tele puede tardar en volver
      } else {
        input.value = '';
      }
    }

    input.addEventListener('focus', () => { clearTimeout(retry); lastCode = ''; });
    input.addEventListener('input', () => {
      clearTimeout(retry);
      input.value = input.value.replace(/\D/g, '').slice(0, 6);
      if (input.value.length === 6) { input.blur(); connect(input.value); }   // conecta solo
    });

    let saved = '';
    try { saved = localStorage.getItem(LS_KEY) || ''; } catch (e) {}
    if (/^\d{6}$/.test(saved)) { input.value = saved; connect(saved); }
    else setTimeout(() => input.focus(), 300);
  }

  return {
    isController: IS_CTRL,
    start() { IS_CTRL ? controllerMode() : screenMode(); },
    code: deviceCode,          // el top 10 cuelga de este codigo (§12.7)
    url: ctrlUrl,
    status() { return state; },
    tick
  };
})();

/* ============================ arranque ============================ */
resize();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});   // offline; se ignora si no existe
}
Store.bind(Link.code());                 // la tabla es la de este codigo (§12.7)
Store.load().then(l => { hs.list = l; });
Prefs.loadMuted().then(m => { if (m) Sfx.setMuted(true); });
Prefs.loadTint().then(n => { if (n) Tint.set(n); });      // el vidrio de la ultima vez
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { Sfx.engine(false); releaseAll(); }
  last = rawLast = performance.now();
});
window.addEventListener('load', () => Link.start());
if (!Link.isController) requestAnimationFrame(frame);   // el celular-control no renderiza el juego
</script>
</body>
</html>
