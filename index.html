<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<!-- black-translucent + viewport-fit=cover: en iOS la pagina ocupa tambien la franja de
     la barra de estado, en vez de quedar empujada hacia abajo dejando un marco arriba.
     Lo que queda debajo del notch se descuenta luego con SAFE (ver resize). -->
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="My Space Drift">
<link rel="icon" href="icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>MY SPACE DRIFT</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  /* dvh = alto visible de verdad. Con 100% o 100vh el movil reserva sitio para barras
     que en pantalla completa no existen, y lo de abajo quedaba cortado. */
  html,body{width:100%;height:100vh;height:100dvh;overflow:hidden;background:#000;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
    -webkit-tap-highlight-color:transparent;touch-action:none;overscroll-behavior:none}
  canvas{display:block;width:100%;height:100%;touch-action:none;image-rendering:pixelated}

  /* Sonda para leer los margenes seguros (notch, isla, barra de gestos) desde JS. */
  #safe{position:fixed;top:0;left:0;width:0;height:0;pointer-events:none;visibility:hidden;
    padding:env(safe-area-inset-top) env(safe-area-inset-right)
            env(safe-area-inset-bottom) env(safe-area-inset-left)}

  /* ---- control (celular): DOM puro, no pasa por el shader, se pinta a mano
         con los mismos cuatro tonos de la paleta ---- */
  #ctrl{position:fixed;inset:0;z-index:10;background:#000;color:#fff;
    font:15px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:1px;
    display:flex;align-items:center;justify-content:center;flex-direction:column;gap:18px}
  #ctrl h1{font-size:19px;font-weight:400;letter-spacing:5px}
  #ctrl p{font-size:12px;color:#a8a8a8;text-align:center;padding:0 24px;line-height:1.8}
  #ctrl input{width:230px;padding:12px;background:transparent;border:2px solid #a8a8a8;
    color:#fff;font:32px ui-monospace,Menlo,Consolas,monospace;letter-spacing:10px;
    text-align:center;outline:none;border-radius:0}
  #ctrl input::placeholder{color:#545454}
  /* El mando es un mando: dos botones grandes, visibles y del alto de la
     pantalla, que se encienden mientras el dedo los aprieta. Antes era una
     miniatura de la pantalla del juego, con el mismo formato que la tele: el
     dedo tenia que apuntar a una mitad en vez de apretar un boton, y en el
     movil quedaba una franja apaisada flotando en el medio de la nada. */
  #ctrl-pad{position:fixed;inset:0;display:flex;flex-direction:column;background:#000;
    padding:calc(10px + env(safe-area-inset-top)) calc(10px + env(safe-area-inset-right))
            calc(10px + env(safe-area-inset-bottom)) calc(10px + env(safe-area-inset-left))}
  #ctrl-pad .row{flex:1;display:flex;gap:10px;min-height:0}
  #ctrl-pad .btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:14px;border:3px solid #a8a8a8;color:#a8a8a8;
    font:13px ui-monospace,Menlo,Consolas,monospace;letter-spacing:4px;
    transition:background .04s linear,color .04s linear}
  #ctrl-pad .btn b{font-size:46px;line-height:1;font-weight:400}
  #ctrl-pad .btn.on{background:#a8a8a8;color:#000}
  /* El freno no es un boton: son los dos a la vez, igual que en el juego. La
     pista va en su propia franja, debajo, y no se come el toque: el que aprieta
     ahi tambien cuenta, porque el lado sale de la mitad de la pantalla. */
  #ctrl-pad .tip{padding-top:12px;text-align:center;pointer-events:none;color:#545454;
    font:11px ui-monospace,Menlo,Consolas,monospace;letter-spacing:2px}
  #ctrl[hidden],#ctrl-pad[hidden]{display:none}   /* hidden pierde contra display:flex */
</style>
<script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js" defer></script>
</head>
<body>
<canvas id="screen"></canvas>
<div id="safe"></div>
<script>
"use strict";

/* ============================================================
   MY SPACE DRIFT — single-file build
   Design doc: plan-juego-vectorial.md (secciones 1-19)
   Todo lo tecnico de esta build vive en CFG.
   ============================================================ */

const CFG = {
  // --- pantalla / estetica ---
  // La escena se dibuja en escala de verde y el shader la cuantiza a la paleta
  // del Game Boy: lo unico que importa aca es la luminancia relativa.
  bg:            '#000000',      // el tono mas oscuro de la paleta
  ink:           '#ffffff',      // el trazo pleno es el tono mas claro de la paleta
  trailFade:     0.42,           // 0..1 por cuadro de 60 Hz. Mas alto = estela mas corta (§2).
                                 // Se convierte a tiempo real en VRAM.fade: la estela dura
                                 // los mismos milisegundos vaya el aparato a los cuadros que vaya.

  // --- estrellas del fondo ---
  // Una estrella es UN punto del LCD, no una figura: dibujada en unidades de
  // mundo cambiaria de tamano con la pantalla y dejaria de ser una estrella.
  // El titileo tiene que cruzar escalones de cuantizacion o no se ve nada: con
  // cuatro tonos y sin trama, media intensidad de mas no existe. El recorrido
  // starLo..starHi va del nivel 0 al 2 (apagada -> gris oscuro -> gris claro) y
  // nunca llega al blanco pleno, que es del trazo del juego.
  starDensity:   420,            // un punto cada tantos pixeles de LCD (mas alto = cielo mas vacio)
  starPeriodMin: 2.5,            // s del ciclo mas rapido: lento a proposito, es un titileo, no un parpadeo
  starPeriodMax: 7.0,            // s del mas lento; cada estrella cae en algun punto entre los dos
  starLo:        0.10,           // intensidad en el valle: por debajo del corte, o sea apagada
  starHi:        0.55,           // intensidad en la cresta: gris claro, nunca blanco

  // --- LCD Game Boy (shader, §21) ---
  // La paleta del hardware son cuatro tonos: blanco, gris claro, gris oscuro y
  // negro. El verde famoso era el tinte del vidrio, no la paleta del juego, asi
  // que un juego nativo se disena en estos cuatro y nada mas.
  gbPalette:     ['#000000', '#545454', '#a8a8a8', '#ffffff'],   // de oscuro a claro
  lcdRows:       144,            // exactamente las filas de la Game Boy
  // Tope de columnas. La consola tenia 160 y aca el ancho no puede ser fijo,
  // porque el lienzo llena la pantalla y hay teles de 16:9, portatiles de 16:10
  // y moviles de 21:9. Lo que si puede es tener techo: pasado el tope el punto
  // se agranda en vez de multiplicarse, asi que ninguna pantalla pasa de aca.
  // 160 clavado se probo y no da: la nave queda en 5 puntos y es una manchita.
  lcdCols:       200,
  // Piso de filas. Agrandar el punto baja las filas, y por debajo de aca la
  // interfaz deja de entrar: a 96 la linea de ayuda del menu se monta sobre la
  // franja de controles. En una pantalla mas ancha que lcdCols/lcdRowsMin el
  // piso le gana al tope y el ancho vuelve a subir un poco: es a proposito,
  // vale mas una interfaz que entra que el ancho clavado.
  lcdRowsMin:    104,
  // Tope de cuadros: el DMG dibujaba 4194304/70224 = 59.7275 pantallas por
  // segundo, y ese es el techo. Un movil de 120 o 144 Hz sin tope se ve "de
  // mas", como video suave, y no como la maquinita. 0 = sin tope (§2.1).
  gbHz:          4194304 / 70224,
  // El mundo se mide en unidades propias y su ALTO vale siempre baseHeight,
  // pase lo que pase con la pantalla real. Lo unico que cambia con el aparato
  // es cuanto ancho se ve. Sin esto el punto del LCD cambiaria de tamano y la
  // nave encogeria en las pantallas grandes (§21.2).
  baseHeight:    480,
  tile:          8,             // la rejilla de 8x8 a la que se alinea toda la interfaz
  lcdGain:       1.0,            // la escena ya se dibuja en los tonos de la paleta
  lcdGrid:       0.10,           // fuerza de la reticula de puntos entre celdas (0 = sin reticula)
  lcdVignette:   0.0,            // sin viñeta: ensucia los tonos planos
  dither:        0.0,            // sin trama: los bordes tienen que ser duros
  inkCrush:      0.28,           // por debajo de esto el pixel es fondo: mata el halo del antialias
                                 // (queda justo por debajo del gris oscuro, 0.33, para no comerselo)

  // --- tinte del vidrio (easter egg, §21.1) ---
  // No es una paleta alternativa: son los mismos cuatro tonos con un filtro de
  // color encima, que es lo que hacia el vidrio de la consola. MONO es el
  // cristal sin tenir, o sea el blanco y negro de siempre.
  tints: [
    { name: 'MONO',    hue: -1 },
    { name: 'GREEN',   hue: 88 },
    { name: 'AMBER',   hue: 38 },
    { name: 'RED',     hue: 4 },
    { name: 'MAGENTA', hue: 316 },
    { name: 'VIOLET',  hue: 268 },
    { name: 'BLUE',    hue: 212 },
    { name: 'CYAN',    hue: 176 },
  ],
  tintSat:       0.62,           // 0 = filtro incoloro, 1 = hue puro (los oscuros se irian a negro de color)
  tintTaps:      4,              // toques seguidos en el titulo para destapar el easter egg
  tintTapWindow: 3.0,            // s entre toque y toque: mas lento y la cuenta vuelve a cero
                                 // (picar cuatro veces apuntando a un titulo en una tele no es rapido)
  tintOsdTime:   1.4,            // s que el nombre del tinte queda en el menu

  // --- nave (§3) ---
  shipLen:       27,             // largo total (proporcion 3:4 con el ancho)
  shipWid:       20.25,
  shipRot:       3.5,            // rad/s de giro sostenido (tope)
  rotInertia:    0.10,           // la inercia del giro es el 10% de la inercia lineal (velocidad angular de crucero)
  rotInertia:    0.10,           // inercia del giro = 10% de la inercia de traslacion
  cruiseThrust:  210,            // px/s^2 — empuje constante hacia adelante, siempre encendido
  brakeDecel:    150,            // px/s^2 de freno con ambos motores
  brakeFloor:    0.5,            // piso duro: frenando nunca baja de esta fraccion de la maxima
  shipFriction:  0.35,           // fraccion de velocidad perdida por segundo (deriva lateral)
  shipMaxSpeed:  212,            // -10%
  shipRadius:    11,             // radio de colision

  // --- entrada de la nave ---
  // Cada partida empieza con la nave llegando de fuera de la pantalla, quieta
  // y girada al azar. La trae el autopiloto con los mismos motores del jugador.
  entryPad:      18,             // px fuera del borde donde nace: entra desde afuera
  entrySpread:   0.70,           // rad — desviacion aleatoria del rumbo inicial hacia el centro
                                 // (mas abierto y la nave se arrastra por fuera del borde antes de entrar:
                                 //  la partida arrancaria con la pantalla sin nave)
  entryAim:      10,             // px de error de punteria admitidos: la zona muerta del giro es
                                 // este error dividido por lo que falta, asi que la punteria se
                                 // afina sola a medida que se acerca
  entryLead:     1.6,            // cuanto adelanta el morro para corregir la deriva: lo que decide
                                 // donde pasa no es hacia donde mira, es hacia donde va
  entryBrake:    120,            // px del centro a los que frena con los dos motores y entra recta.
                                 // Frenar de 212 al piso (150 px/s^2) come justo esta distancia:
                                 // llega al centro al minimo que permiten las fisicas
  entryArrive:   14,             // px del centro con los que ya se da por llegada
  entryGrace:    1.2,            // s de gracia con los que arranca el jugador tras la llegada
  entryMax:      5.0,            // s — red de seguridad por si el autopiloto no llegara
  // Mientras la trae el autopiloto la nave no es del jugador, y eso tiene que
  // verse sin explicarlo: llega en gris y con una escuadra marcando adonde va.
  entryTone:     0.62,           // 0..1 — el gris claro de la paleta, no el blanco pleno
  entryMark:     30,             // px — tamano de la escuadra del centro, que se cierra al llegar
  readyBlink:    0.55,           // s de parpadeo de la nave al pasar el mando al jugador
  readyHz:       9,              // parpadeos por segundo de ese relevo

  // --- disparo (§7) ---
  maxBullets:    4,
  fireInterval:  0.17,           // s — cadencia fija: picotear no dispara mas
  bulletSpeed:   430,
  bulletLife:    0.55,
  bulletStreak:  0.016,          // s de velocidad que mide la raya: a mas empuje, raya mas larga
  bulletSpinMin: 5,              // rad/s — piso de giro, con la nave al minimo (§7.1)
  bulletSpinMax: 18,             // rad/s — giro a velocidad tope
  bulletSpinKick: 0.7,           // parte del giro de la nave que se lleva la bala al salir
  bulletFade:    3.0,            // exponente del apagado: 1 = lineal, mas alto = arranca mas lento

  // --- meteoros (§6) ---
  meteorSpeedMin: 55,
  meteorSpeedMax: 135,
  meteorRotMax:   0.35,          // rad/s — giro ligero de crucero: la roca cabecea, no gira como un ventilador
  objectScale:    0.6,           // -40% al tamano de las rocas
  fairnessTime:   0.5,           // s — guarda de justicia

  // --- particion (§6) ---
  splitChanceMin: 0.05,          // al empezar, uno de cada veinte impactos parte en vez de romper
  splitChanceMax: 0.10,          // al final de la curva, uno de cada diez
  splitDecay:     0.50,          // cada mitad hereda la mitad de la probabilidad de su madre
  splitKeep:      0.40,          // masa que se lleva cada mitad: 40 + 40, y el 20% restante se hace polvo
  splitAngMin:    10,            // grados que se abre cada mitad: minimo, siempre alcanzable
  splitAngMax:    25,            // grados de apertura maxima, solo con la dificultad al tope
  splitMinRadius: 3,             // px — si las mitades salieran mas chicas que esto, la roca se rompe entera
  splitGap:       1.5,           // px de aire entre las dos mitades recien cortadas
  splitSpinGain:  0.05,          // rad/s de giro por cada px/s de bala y px de radio de la mitad
  splitSpinMax:   6.0,           // rad/s — tope del giro tras el impacto

  // --- pickup (§8) ---
  dropChance:    0.11,
  pickupScale:   0.6,            // -40% tambien al pickup; perilla aparte por legibilidad
  dropSizeBias:  0.5,            // la roca mas chica del nivel suelta +50%, la mas grande -50%
  repairChance:  0.20,           // de cada 10 pickups, 2 son de reparacion
  invulnTime:    6.0,
  invulnBlink:   2.0,

  // --- vidas (§9) ---
  lives:         2,
  hitGrace:      1.5,            // s de gracia tras recibir dano (evita doble muerte instantanea)

  // --- puntaje (§10) ---
  timeDrip:      6,              // pts/s base
  levelBase:     700,
  levelStep:     600,
  refillTime:    3.2,            // s en volver a la densidad tras subir de nivel

  // --- navegacion de menus (§4.2) ---
  chordWait:     0.18,           // s que se espera al segundo dedo antes de dar por hecho que va solo
  repeatFirst:   0.34,           // s hasta la primera repeticion al mantener un lado
  repeatNext:    0.11,           // s entre repeticiones

  // --- control remoto (§4.3) ---
  remoteBeat:    0.25,           // s entre latidos del celular mientras tiene un dedo apoyado
  remoteTimeout: 1.0,            // s de silencio tras los que la TV suelta los motores sola

  // --- audio (§13) ---
  volMaster:     0.50,
  volFloorHz:    380,            // Hz — piso duro: ni el piezo LCD ni un altavoz de movil bajan de aqui
  attack:        0.0015,         // s — casi instantaneo, solo lo justo para no chasquear
  release:       0.004,          // s — el piezo se apaga, no se desvanece
  engineHz:      440,            // portadora del motor
  enginePulseHz: 18,             // el "putt-putt": la portadora se abre y cierra a esta tasa
  engineVol:     0.05,

  // --- modo demo (§12.2) ---
  attractDelay:  6.0,            // s de inactividad en el menu antes de la demo de fondo
  demoCardTime:  4.6,            // s que cada cartel de la demo elegida queda en pantalla
                                 // (hay que poder leerlo de un renglon sin perder de vista la nave)

  // --- otros ---
  maxScores:     10,
};

/* ============================ storage ============================ */
// Top 10 debe sobrevivir a cerrar la app (§12.6). La tabla cuelga del codigo
// de la tele: cada codigo tiene la suya y se guarda firmada, asi que cambiar
// el JSON desde el inspector la invalida y la tabla vuelve vacia en vez de
// aceptar el puntaje inventado.
// window.storage (entorno de artifacts) -> localStorage -> memoria.
const Store = (() => {
  // Nombre historico: la tabla vieja (una sola, sin codigo) se migra a la del
  // codigo la primera vez que arranca esta version, para no perder records.
  const OLD_KEY = 'vectordrift:scores';
  const keyFor  = c => 'vectordrift:scores:' + c;
  const SALT    = 'my-space-drift/scores/v2';
  let code = '', mem = null;
  const hasWin = typeof window !== 'undefined' && window.storage && typeof window.storage.get === 'function';
  const enc = new TextEncoder();

  const readRaw = async k => {
    try {
      if (hasWin) { const r = await window.storage.get(k, false); return (r && r.value) || ''; }
      return localStorage.getItem(k) || '';
    } catch (e) { return ''; }
  };
  const writeRaw = async (k, v) => {
    try {
      if (hasWin) await window.storage.set(k, v, false);
      else localStorage.setItem(k, v);
    } catch (e) { /* queda en la memoria de la sesion */ }
  };

  // Firma de la tabla. La clave sale del codigo de la tele, asi que una tabla
  // firmada tampoco se puede copiar a otro codigo. Con Web Crypto (https) es
  // HMAC-SHA-256; sin el queda un checksum, mas debil pero igual rompe la
  // edicion a mano.
  async function sign(body) {
    const seed = SALT + '|' + code;
    const subtle = (typeof crypto !== 'undefined' && crypto.subtle) || null;
    if (subtle) {
      try {
        const key = await subtle.importKey('raw', enc.encode(seed), { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']);
        const mac = await subtle.sign('HMAC', key, enc.encode(body));
        return [...new Uint8Array(mac)].map(b => b.toString(16).padStart(2, '0')).join('');
      } catch (e) { /* sin Web Crypto util: queda el checksum */ }
    }
    let h = 0x811c9dc5;
    const s = seed + '|' + body;
    for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; }
    return 'c' + h.toString(16).padStart(8, '0');
  }

  // Solo sobreviven los tres campos que el juego dibuja, ya ordenados y
  // recortados: lo que venga de mas en el JSON no llega a la pantalla.
  const clean = list => (Array.isArray(list) ? list : [])
    .filter(e => e && typeof e === 'object')
    .map(e => ({
      i: String(e.i == null ? '???' : e.i).slice(0, 3).toUpperCase(),
      s: Math.max(0, Math.min(999999, Math.floor(Number(e.s) || 0))),
      l: Math.max(1, Math.min(99, Math.floor(Number(e.l) || 1)))
    }))
    .sort((a, b) => b.s - a.s)
    .slice(0, CFG.maxScores);

  const bodyOf = list => JSON.stringify({ c: code, l: list });

  async function save(list) {
    mem = clean(list);
    const b = bodyOf(mem);
    await writeRaw(keyFor(code), JSON.stringify({ v: 2, b, g: await sign(b) }));
  }

  async function load() {
    if (mem) return mem;
    const raw = await readRaw(keyFor(code));
    if (!raw) {                                  // primer arranque con este codigo
      const old = await readRaw(OLD_KEY);
      mem = [];
      if (old) { try { mem = clean(JSON.parse(old)); } catch (e) { mem = []; } }
      if (mem.length) await save(mem);
      return mem;
    }
    mem = [];
    try {
      const rec = JSON.parse(raw);
      if (rec && rec.b && rec.g && rec.g === await sign(rec.b)) {
        const inner = JSON.parse(rec.b);
        if (inner && inner.c === code) mem = clean(inner.l);   // firma valida y del mismo codigo
      }
    } catch (e) { mem = []; }                    // firma rota: la tabla se descarta entera
    return mem;
  }

  return {
    bind(c) { code = String(c || ''); mem = null; },
    // el codigo cambio (choque de id en el servidor): la tabla se muda con el
    async rekey(next) { const list = mem || []; code = String(next || ''); await save(list); },
    load, save,
    cached() { return mem || []; }
  };
})();

// Igual que los records: si el jugador silencia, tiene que seguir silenciado
// la proxima vez que abra el juego. Lo mismo vale para el tinte de la pantalla:
// el vidrio elegido es del aparato, no de la partida.
const Prefs = (() => {
  const KEY_MUTE = 'vectordrift:muted';
  const KEY_TINT = 'vectordrift:tint';
  const hasWin = typeof window !== 'undefined' && window.storage && typeof window.storage.get === 'function';

  const read = async k => {
    try {
      if (hasWin) { const r = await window.storage.get(k, false); return (r && r.value) || ''; }
      return localStorage.getItem(k) || '';
    } catch (e) { return ''; }
  };
  const write = (k, v) => {
    try {
      if (hasWin) window.storage.set(k, v, false);
      else localStorage.setItem(k, v);
    } catch (e) { /* queda en la sesion */ }
  };

  return {
    async loadMuted() { return (await read(KEY_MUTE)) === '1'; },
    saveMuted(m) { write(KEY_MUTE, m ? '1' : '0'); },
    // El nombre y no el indice: reordenar CFG.tints no le cambia el vidrio a
    // nadie, y un nombre que ya no existe cae solo en el primero de la lista.
    async loadTint() { return await read(KEY_TINT); },
    saveTint(name) { write(KEY_TINT, String(name || '')); }
  };
})();

/* ============================ audio (§13) ============================ */
// Suena a maquinita LCD: un zumbador piezoelectrico movido por ondas cuadradas, como
// una Game & Watch. De ese hardware salen todas las reglas de este modulo:
//   - solo 'square': el piezo no reproduce otra cosa
//   - nada por debajo de CFG.volFloorHz: el piezo no tiene graves, y el altavoz de un
//     movil tampoco, asi que la fidelidad historica y la reproduccion real coinciden
//   - envolventes rectangulares: el piezo esta encendido o apagado, no se desvanece
//   - sin ruido blanco: la Game & Watch no tenia generador de ruido. Sus explosiones
//     eran saltos rapidos de tono, que es lo que hace scramble()
//   - la dinamica va por duracion, no por volumen: el piezo no controla amplitud
// Nada grabado, ni un solo archivo. El audio nunca es informacion necesaria: todo lo
// que suena tambien esta en pantalla.

// La menor pentatonica, de 440 Hz a 2637. Toda frecuencia del juego sale de esta tabla:
// cualquier par de notas de aqui suena intencional en vez de aleatorio.
const TONES = [440, 523, 587, 659, 784, 880, 1047, 1175, 1319, 1568, 1760, 2093, 2349, 2637];

const Sfx = (() => {
  let ac = null, master = null;
  let engOsc = null, engLfo = null, engGain = null;
  let muted = false, ready = false, quiet = false;
  const last = {};                  // ultimo disparo de cada sonido, para el limitador

  // Sin argumentos es idempotente (asi la llaman los gestos del usuario). Pasarle un
  // contexto rehace el modulo sobre el: es lo que usa el banco offline para renderizar
  // los sonidos a PCM y comprobarlos sin que nadie escuche.
  function init(ctx) {
    if (ready && !ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!ctx && !AC) return;
    try { ac = ctx || new AC(); } catch (e) { return; }
    engOsc = engLfo = engGain = null;
    for (const k in last) delete last[k];
    master = ac.createGain();
    master.gain.value = muted ? 0 : CFG.volMaster;
    master.connect(ac.destination);
    ready = true;
  }
  function resume() { if (ac && ac.state === 'suspended') ac.resume(); }
  // quiet calla la simulacion, no la interfaz: un toque en un boton durante la demo
  // sigue haciendo clic, porque ese sonido lo provoca el usuario y no el bot.
  function audible() { return ready && !muted && !quiet; }

  // Una nota cuadrada agendada en tiempo absoluto del AudioContext.
  function tone(freq, at, dur, vol) {
    if (!ready) return;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = 'square';
    o.frequency.setValueAtTime(Math.max(CFG.volFloorHz, freq), at);
    g.gain.setValueAtTime(0, at);
    g.gain.linearRampToValueAtTime(vol, at + CFG.attack);
    g.gain.setValueAtTime(vol, at + Math.max(CFG.attack, dur - CFG.release));
    g.gain.linearRampToValueAtTime(0, at + dur);
    o.connect(g); g.connect(master);
    o.start(at); o.stop(at + dur + 0.005);
  }

  // notes = [[Hz, ms], ...] encadenadas desde ahora mismo. Aqui no hay setTimeout a
  // proposito: un temporizador deriva bajo carga, no se cancela al mutear y no comparte
  // reloj con el audio. Todo se agenda de golpe sobre ac.currentTime.
  function seq(notes, vol) {
    if (!audible()) return;
    let at = ac.currentTime;
    for (let i = 0; i < notes.length; i++) {
      const d = notes[i][1] / 1000;
      tone(notes[i][0], at, d, vol);
      at += d;
    }
  }

  // La explosion Game & Watch: un tono que se despeña a saltos por la escala. hi y lo
  // son indices dentro de TONES; el centro baja con el tiempo y se le añade temblor.
  function scramble(steps, hi, lo, stepMs, vol) {
    if (!audible()) return;
    let at = ac.currentTime;
    const d = stepMs / 1000, top = TONES.length - 1;
    for (let i = 0; i < steps; i++) {
      const t = steps > 1 ? i / (steps - 1) : 0;
      const j = Math.round(hi + (lo - hi) * t + (Math.random() * 2 - 1) * 1.5);
      tone(TONES[Math.min(top, Math.max(0, j))], at, d, vol * (1 - t * 0.35));
      at += d;
    }
  }

  // Limitador por sonido. shoot() sale de un bucle de autofuego y destroy() puede
  // dispararse varias veces en el mismo frame; sin esto el resultado es barro. Solo
  // calla audio repetido: las balas, las rocas y el puntaje no se enteran.
  function fresh(key, ms) {
    if (!ready) return false;
    const t = ac.currentTime;
    if (last[key] !== undefined && t - last[key] < ms / 1000) return false;
    last[key] = t;
    return true;
  }

  return {
    init, resume,
    get tones() { return TONES; },
    get muted() { return muted; },
    // Callar sin mutear: el modo demo del menu se ve, pero no se oye.
    get quiet() { return quiet; },
    set quiet(v) { quiet = !!v; if (quiet) Sfx.engine(false); },
    setMuted(m) {                        // aplica sin guardar: lo usa la carga inicial
      muted = !!m;
      if (master) master.gain.value = muted ? 0 : CFG.volMaster;
      if (muted) Sfx.engine(false);
      return muted;
    },
    toggleMute() {
      Sfx.setMuted(!muted);
      Prefs.saveMuted(muted);
      return muted;
    },
    // El motor no es un zumbido grave (a 62 Hz un movil no daba nada): es un tableteo.
    // Una portadora cuadrada que un LFO cuadrado abre y cierra. Dos osciladores y cero
    // temporizadores; la señal del LFO se suma al valor intrinseco de la ganancia.
    engine(on) {
      if (!ready) return;
      const want = on && !muted && !quiet;
      if (want && !engOsc) {
        const t = ac.currentTime, half = CFG.engineVol / 2;
        engOsc = ac.createOscillator(); engOsc.type = 'square';
        engOsc.frequency.value = CFG.engineHz;
        engLfo = ac.createOscillator(); engLfo.type = 'square';
        engLfo.frequency.value = CFG.enginePulseHz;
        const depth = ac.createGain(); depth.gain.value = half;
        engGain = ac.createGain();
        engGain.gain.setValueAtTime(0, t);
        engGain.gain.linearRampToValueAtTime(half, t + 0.04);
        engLfo.connect(depth); depth.connect(engGain.gain);
        engOsc.connect(engGain); engGain.connect(master);
        engOsc.start(t); engLfo.start(t);
      } else if (!want && engOsc) {
        const t = ac.currentTime, o = engOsc, l = engLfo, g = engGain;
        g.gain.cancelScheduledValues(t);
        g.gain.setValueAtTime(g.gain.value, t);
        g.gain.linearRampToValueAtTime(0, t + 0.05);
        o.stop(t + 0.07); l.stop(t + 0.07);
        engOsc = engLfo = engGain = null;
      }
    },

    // Los ocho efectos. El rango de ganancia es estrecho a proposito (0.07-0.14): lo que
    // separa un sonido chico de uno grande es cuanto dura, no cuanto suena.
    ui()      { if (ready && !muted) tone(1760, ac.currentTime, 0.018, 0.07); },
    shoot()   { if (fresh('shoot', 60)) seq([[2637, 8], [2093, 8], [1568, 8]], 0.08); },
    destroy() { if (fresh('destroy', 45)) scramble(12, 11, 2, 15, 0.13); },
    pickup()  { seq([[1047, 40], [1319, 40], [1568, 40]], 0.10); },
    repair()  { seq([[880, 55], [1047, 55], [1319, 55], [1760, 90]], 0.10); },
    damage()  { seq([[784, 45], [587, 45], [440, 110]], 0.14); },
    death()   { seq([[1568, 90], [1319, 90], [1175, 90], [880, 90],
                     [784, 90], [659, 90], [523, 90], [440, 320]], 0.14); },
    level()   { seq([[1047, 70], [1319, 70], [1568, 70], [2093, 140]], 0.12); },
  };
})();

// Alcanzable desde fuera: sin esto ni el banco de pruebas ni el test offline pueden
// tocar el modulo, porque Sfx es un const de ambito de script.
window.Sfx = Sfx;
// El modo demo tampoco vibra: hacer temblar el movil en el menu es peor que sonar.
function buzz(ms) {
  if (Sfx.quiet) return;
  if (navigator.vibrate) { try { navigator.vibrate(ms); } catch (e) {} }
}

/* ============================ canvas ============================ */
// El juego se dibuja en 'scene', un canvas 2D fuera del DOM y de resolucion
// baja (CFG.lcdRows filas): los trazos se rasterizan ya del tamano del pixel
// del LCD. Lo visible es 'cv', el canvas WebGL donde el shader cuantiza esa
// escena a la paleta del Game Boy y la agranda sin interpolar (§21).
// El juego mide en UNIDADES DE MUNDO: H vale siempre CFG.baseHeight y W sale
// de la relacion de aspecto. Wpx/Hpx son los px CSS reales y SC el puente
// (1 unidad = SC px CSS); nadie mira Wpx/Hpx salvo el transform y la entrada.
// El punto del LCD sale del eje que APRIETE (§21.2): en una pantalla angosta
// manda el alto y quedan las 144 filas del DMG, y en una ancha manda el tope de
// columnas. Sin ese tope el ancho se va con la relacion de aspecto —256 puntos
// en una tele, 368 en un movil con la barra del navegador puesta, contra los 160
// de la maquinita— y el juego deja de verse pixelado: se ve fino.
const cv = document.getElementById('screen');
const scene = document.createElement('canvas');
const ctx = scene.getContext('2d');
let trail = document.createElement('canvas');
let tctx = trail.getContext('2d');
let W = 0, H = 0, Wpx = 0, Hpx = 0, SC = 1, DPR = 1, PIX = 1;

// Margenes seguros del aparato (notch, isla dinamica, barra de gestos). El lienzo llega
// hasta el borde fisico; solo el HUD se aparta, para no escribir debajo del recorte.
const SAFE = { t: 0, r: 0, b: 0, l: 0 };
const safeEl = document.getElementById('safe');

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  // visualViewport es lo que se ve de verdad; innerWidth/innerHeight incluyen franjas
  // que en pantalla completa no estan, y por eso se cortaba la parte de abajo.
  const vv = window.visualViewport;
  Wpx = Math.max(1, Math.floor(vv ? vv.width : window.innerWidth));
  Hpx = Math.max(1, Math.floor(vv ? vv.height : window.innerHeight));
  if (safeEl) {
    const s = getComputedStyle(safeEl);
    SAFE.t = parseFloat(s.paddingTop) || 0;
    SAFE.r = parseFloat(s.paddingRight) || 0;
    SAFE.b = parseFloat(s.paddingBottom) || 0;
    SAFE.l = parseFloat(s.paddingLeft) || 0;
  }
  H = CFG.baseHeight;                             // el alto del mundo NO cambia nunca
  SC = Hpx / H;                                   // px CSS por unidad de mundo
  W = Wpx / SC;                                   // ... solo cambia cuanto ancho se ve
  // El eje que apriete pone el tamano del punto: el alto en una pantalla
  // angosta (144 filas), el tope de columnas en una ancha, y el piso de filas
  // corta al tope cuando la pantalla es tan ancha que ya no entraria el
  // menu (§21.2).
  PIX = Math.min(CFG.lcdRows / H, Math.max(CFG.lcdCols / W, CFG.lcdRowsMin / H));
  const bw = Math.max(1, Math.round(W * PIX)), bh = Math.max(1, Math.round(H * PIX));
  for (const c of [scene, trail]) { c.width = bw; c.height = bh; }
  LW = bw;                                        // el hit-test lo necesita antes del primer frame
  cv.width = Math.floor(Wpx * DPR); cv.height = Math.floor(Hpx * DPR);
  cv.style.width = Wpx + 'px'; cv.style.height = Hpx + 'px';
  ctx.setTransform(PIX, 0, 0, PIX, 0, 0);
  ctx.imageSmoothingEnabled = false;
  tctx.setTransform(1, 0, 0, 1, 0, 0);            // la estela se escribe por pixel, sin transform
  tctx.clearRect(0, 0, bw, bh);
  VRAM.resize(bw, bh);
  Stars.reset(bw, bh);                            // el cielo se sortea de nuevo: cambio el tamano del buffer
  LCD.resize();
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 120));
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', resize);
  window.visualViewport.addEventListener('scroll', resize);
}

/* ======================= shader LCD Game Boy (§21) =======================
   Un solo paso de post-proceso sobre la escena:
   muestreo al centro de cada celda -> luminancia -> corte del borde suave ->
   cuantizacion a los 4 tonos del hardware -> reticula de puntos.
   El corte (inkCrush) es lo que hace que el juego se vea nativo: el canvas no
   deja apagar el antialias de los trazos, asi que el halo tenue que deja
   alrededor de cada linea se manda a negro en vez de volverse un gris.
   ==================================================================== */
const LCD = (() => {
  const VERT = `
    attribute vec2 p;
    varying vec2 uv;
    void main() {
      uv = p * 0.5 + 0.5;
      uv.y = 1.0 - uv.y;          // fila 0 de la textura = arriba de la pantalla
      gl_Position = vec4(p, 0.0, 1.0);
    }`;

  const FRAG = `
    precision mediump float;
    varying vec2 uv;
    uniform sampler2D src;
    uniform vec2  lcd;            // celdas del LCD (ancho, alto)
    uniform vec3  pal[4];         // paleta, de oscuro a claro
    uniform vec3  tint;           // filtro del vidrio; (1,1,1) = sin tenir
    uniform float gridK, gap, ditherK, gain, crush;

    float bayer2(vec2 a) { a = floor(a); return fract(a.x * 0.5 + a.y * a.y * 0.75); }
    float bayer4(vec2 a) { return bayer2(a * 0.5) * 0.25 + bayer2(a); }   // 16 niveles, 0..0.9375

    void main() {
      vec2 cell = floor(uv * lcd);
      vec3 s = texture2D(src, (cell + 0.5) / lcd).rgb;
      float lum = clamp(dot(s, vec3(0.299, 0.587, 0.114)) * gain, 0.0, 1.0);

      // el halo del antialias no llega a ser un tono: es fondo
      lum = lum < crush ? 0.0 : lum;

      float d = bayer4(cell) * ditherK + (1.0 - ditherK) * 0.5;   // ditherK 0 = redondeo seco
      float q = clamp(floor(lum * 3.0 + d), 0.0, 3.0);

      // reticula: en el hueco entre celdas el punto cae un tono, como en el
      // dot matrix de verdad. Baja un escalon entero para no inventar colores
      // fuera de la paleta.
      vec2 f = fract(uv * lcd);
      vec2 e = min(f, 1.0 - f);
      if (gridK > 0.5 && min(e.x, e.y) < gap) q = max(q - 1.0, 0.0);

      // el tinte va al final, sobre el tono ya cuantizado: filtra el vidrio,
      // no la escena, asi que en pantalla siguen habiendo cuatro tonos exactos
      vec3 col = q < 0.5 ? pal[0] : (q < 1.5 ? pal[1] : (q < 2.5 ? pal[2] : pal[3]));
      gl_FragColor = vec4(col * tint, 1.0);
    }`;

  let gl = null, prog = null, tex = null, fb = null, U = {};

  const hexRgb = h => [1, 3, 5].map(i => parseInt(h.substr(i, 2), 16) / 255);

  function compile(type, srcTxt) {
    const s = gl.createShader(type);
    gl.shaderSource(s, srcTxt);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    return s;
  }

  function build() {
    prog = gl.createProgram();
    gl.attachShader(prog, compile(gl.VERTEX_SHADER, VERT));
    gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FRAG));
    gl.bindAttribLocation(prog, 0, 'p');
    gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
    gl.useProgram(prog);

    const buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);  // triangulo que tapa la pantalla
    gl.enableVertexAttribArray(0);
    gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

    tex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, tex);
    for (const p of [gl.TEXTURE_MIN_FILTER, gl.TEXTURE_MAG_FILTER]) gl.texParameteri(gl.TEXTURE_2D, p, gl.NEAREST);
    for (const p of [gl.TEXTURE_WRAP_S, gl.TEXTURE_WRAP_T]) gl.texParameteri(gl.TEXTURE_2D, p, gl.CLAMP_TO_EDGE);

    for (const n of ['src', 'lcd', 'gridK', 'gap', 'ditherK', 'gain', 'crush', 'tint']) U[n] = gl.getUniformLocation(prog, n);
    gl.uniform1i(U.src, 0);
    gl.uniform3f(U.tint, 1, 1, 1);       // arranca sin tenir; Tint lo pisa al cargar la preferencia
    gl.uniform1f(U.gridK, CFG.lcdGrid);
    gl.uniform1f(U.ditherK, CFG.dither);
    gl.uniform1f(U.gain, CFG.lcdGain);
    gl.uniform1f(U.crush, CFG.inkCrush);
    CFG.gbPalette.forEach((h, i) => gl.uniform3fv(gl.getUniformLocation(prog, 'pal[' + i + ']'), hexRgb(h)));
  }

  try {
    gl = cv.getContext('webgl', { alpha: false, antialias: false, depth: false, stencil: false })
      || cv.getContext('experimental-webgl', { alpha: false, antialias: false });
    if (gl) build();
  } catch (e) { gl = null; }

  // Sin WebGL el juego no se queda en negro: se copia la escena sin interpolar.
  // Se pierde la paleta, no el pixelado ni el juego.
  if (!gl) fb = cv.getContext('2d');

  // Filtro del vidrio: multiplica el color ya cuantizado. Se guarda en CSS
  // ademas de en el uniform porque el camino sin WebGL lo pinta a mano.
  let tintCss = '';

  return {
    get ok() { return !!gl; },
    setTint(rgb) {
      const [r, g, b] = rgb;
      tintCss = (r > 0.999 && g > 0.999 && b > 0.999)
        ? '' : 'rgb(' + [r, g, b].map(c => Math.round(c * 255)).join(',') + ')';
      if (gl) { gl.useProgram(prog); gl.uniform3f(U.tint, r, g, b); }
    },
    resize() {
      if (gl) gl.viewport(0, 0, cv.width, cv.height);
      else if (fb) fb.imageSmoothingEnabled = false;
    },
    present() {
      if (!gl) {
        if (!fb) return;
        fb.imageSmoothingEnabled = false;
        fb.clearRect(0, 0, cv.width, cv.height);
        fb.drawImage(scene, 0, 0, cv.width, cv.height);
        if (tintCss) {                       // sin shader el tinte se multiplica encima
          fb.globalCompositeOperation = 'multiply';
          fb.fillStyle = tintCss;
          fb.fillRect(0, 0, cv.width, cv.height);
          fb.globalCompositeOperation = 'source-over';
        }
        return;
      }
      gl.bindTexture(gl.TEXTURE_2D, tex);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, scene);
      gl.uniform2f(U.lcd, scene.width, scene.height);
      // el hueco de la reticula es medio pixel de pantalla, en fraccion de celda
      const cellPx = Math.max(1, cv.width) / scene.width;
      gl.uniform1f(U.gap, clamp(0.5 / cellPx, 0.04, 0.12));
      gl.drawArrays(gl.TRIANGLES, 0, 3);
    }
  };
})();

/* ==================== tinte de la pantalla (§21.1) ====================
   Easter egg. La consola nunca cambiaba de paleta: cambiaba el vidrio, y por
   eso esto no toca ni los cuatro tonos ni el juego. El shader cuantiza igual
   que siempre y el color se multiplica al final, asi que en pantalla siguen
   habiendo cuatro tonos exactos, solo que tenidos.
   Se destapa tocando el titulo del menu CFG.tintTaps veces seguidas (o con la
   tecla T en escritorio) y cada vez pasa al siguiente hue de la lista. El
   elegido se guarda, asi que el vidrio sigue puesto al reabrir el juego.
   La secuencia es para encontrarlo, no para usarlo: una vez destapado, un solo
   toque pasa al siguiente vidrio. Y como el tinte solo se guarda despues de
   haberlo destapado, tener uno guardado ya cuenta como encontrado: quien lo
   descubrio una vez no vuelve a picar cuatro veces nunca mas.
   ==================================================================== */
const Tint = (() => {
  const list = CFG.tints;
  let idx = 0, osd = 0, taps = 0, lastTap = 0, found = false;

  // hue -> color puro (HSV con s=v=1) aclarado hacia el blanco segun
  // CFG.tintSat: el filtro tine, no repinta. Con el blanco puro no hay filtro.
  function rgb() {
    const h = list[idx].hue;
    if (!(h >= 0)) return [1, 1, 1];
    const f = n => {
      const k = (n + h / 60) % 6;
      return 1 - Math.max(0, Math.min(k, 4 - k, 1));
    };
    const s = CFG.tintSat;
    return [f(5), f(3), f(1)].map(c => 1 - s + s * c);
  }
  function apply() { LCD.setTint(rgb()); }

  function set(name) {
    const i = list.findIndex(t => t.name === name);
    idx = i < 0 ? 0 : i;                       // nombre viejo o vacio: vidrio limpio
    found = true;                              // habia un tinte guardado: ya lo destapo
    apply();
  }
  function cycle() {
    idx = (idx + 1) % list.length;
    found = true;                              // se llega aca por la secuencia o por la tecla T
    apply();
    Prefs.saveTint(list[idx].name);
    osd = CFG.tintOsdTime;
    return list[idx].name;
  }
  // Antes de destaparlo los toques sueltos no hacen nada y no suenan: solo el
  // ultimo de la secuencia cambia el vidrio, o dejaria de ser un secreto.
  // Despues ya no hay secreto que guardar y el titulo es un boton comun: un
  // toque, el siguiente vidrio.
  function tap() {
    if (found) { cycle(); return true; }
    const now = performance.now();
    taps = (now - lastTap > CFG.tintTapWindow * 1000) ? 1 : taps + 1;
    lastTap = now;
    if (taps < CFG.tintTaps) return false;
    taps = 0;
    cycle();
    return true;
  }

  return {
    set, cycle, tap,
    get found() { return found; },
    get name() { return list[idx].name; },
    get osd()  { return osd; },
    tick(dt) { if (osd > 0) osd = Math.max(0, osd - dt); }
  };
})();

/* ============================ input (§4) ============================ */
const Input = {
  left: false, right: false,
  pointers: new Map(),
  lastTouch: 0,
  tapPos: null,        // consumido por las pantallas de menu
  edgeLeft: false, edgeRight: false, edgeBoth: false,
  _pl: false, _pr: false, _pb: false,

  update() {
    let l = false, r = false;
    // los dedos apoyados sobre un boton de la interfaz no son motor (§13.2)
    for (const p of this.pointers.values()) { if (p.ui) continue; if (p.x < W / 2) l = true; else r = true; }
    if (Key.left) l = true;
    if (Key.right) r = true;
    this.left = l; this.right = r;
    const both = l && r;
    this.edgeLeft  = l && !this._pl;
    this.edgeRight = r && !this._pr;
    this.edgeBoth  = both && !this._pb;
    this._pl = l; this._pr = r; this._pb = both;
  },
  consumeTap() { const t = this.tapPos; this.tapPos = null; return t; }
};
const Key = { left: false, right: false };

/* ========================= navegacion de menus (§4.2) =========================
   Los menus se manejan con los mismos dos controles que la nave: un lado mueve
   la seleccion y los dos juntos eligen.

   El problema de leer los flancos sueltos es que dos dedos nunca aterrizan en
   el mismo milisegundo: el que llega primero se lee como "un lado" y mueve la
   seleccion, y recien despues se lee "los dos" y elige. Un solo gesto termina
   haciendo dos cosas.

   Por eso el gesto NO se resuelve mientras haya algo apretado: se acumula
   quien se toco y se decide al soltar todo. Si en algun momento estuvieron los
   dos, es elegir y no hubo movimiento. La unica excepcion es mantener un lado
   apretado mas de chordWait sin el otro: ahi ya no puede ser un acorde, asi
   que se mueve en el acto y arranca la repeticion.
   ==================================================================== */
const Nav = (() => {
  let open = false, sawBoth = false, dir = 0, age = 0, moved = false, repeat = 0;
  let blocked = false;

  function reset() { open = false; sawBoth = false; dir = 0; age = 0; moved = false; repeat = 0; }

  // Al cambiar de pantalla hay que soltar todo antes de que la nueva escuche:
  // si no, morir con los dos motores apretados elegiria solo en GAME OVER.
  function armAfterRelease() { reset(); blocked = true; }

  // Devuelve { move: -1 | 0 | 1, select: bool } una sola vez por evento.
  function update(dt) {
    const L = Input.left, R = Input.right;
    const out = { move: 0, select: false };

    if (!L && !R) {                       // se solto todo: recien ahora se decide
      if (blocked) { blocked = false; reset(); return out; }
      if (open) {
        if (sawBoth) out.select = true;
        else if (!moved && dir) out.move = dir;
      }
      reset();
      return out;
    }

    if (blocked) return out;
    if (!open) { reset(); open = true; }
    age += dt;
    if (L && R) sawBoth = true;
    else if (!sawBoth) dir = L ? -1 : 1;

    if (sawBoth) return out;              // ya es acorde: solo falta soltar
    if (!moved && age >= CFG.chordWait) { // mantenido: ya no puede ser acorde
      out.move = dir; moved = true; repeat = CFG.repeatFirst;
    } else if (moved) {
      repeat -= dt;
      if (repeat <= 0) { out.move = dir; repeat = CFG.repeatNext; }
    }
    return out;
  }

  return { update, armAfterRelease };
})();

function pos(e) {
  // el dedo llega en px CSS; el juego solo entiende unidades de mundo
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) / SC, y: (e.clientY - r.top) / SC };
}
cv.addEventListener('pointerdown', e => {
  const p = pos(e);
  try { cv.setPointerCapture(e.pointerId); } catch (err) {}
  // se decide aca, no en el frame: el dedo queda marcado mientras siga apoyado
  if (muteActive() && hit(muteBox(), p)) p.ui = true;
  Input.pointers.set(e.pointerId, p);
  Input.tapPos = { x: p.x, y: p.y };
  Input.lastTouch = performance.now();
  Sfx.init(); Sfx.resume();
  e.preventDefault();
}, { passive: false });
cv.addEventListener('pointermove', e => {
  // el mouse se solto fuera de la ventana y nunca nos llego el up: el primer
  // movimiento sin botones apretados lo delata
  if (e.pointerType === 'mouse' && e.buttons === 0) { drop(e); return; }
  const old = Input.pointers.get(e.pointerId);
  if (!old) return;
  const p = pos(e);
  if (old.ui) p.ui = true;          // moverse un pixel no convierte el boton en motor
  Input.pointers.set(e.pointerId, p);
}, { passive: false });

/* ---------------- red de seguridad contra motores trabados (§4.3) ----------
   Un motor que se queda encendido solo es un puntero que quedo en el mapa sin
   su pointerup. Pasa mas de lo que parece: el navegador se queda el gesto, se
   pierde la captura del puntero, la app se va a segundo plano con el dedo
   apoyado, o se suelta una tecla con la ventana sin foco. Ninguno de esos
   casos avisa por el camino normal, asi que hay que cerrarlos uno por uno.
   -------------------------------------------------------------------- */
function drop(e) { Input.pointers.delete(e.pointerId); }
function releaseLocalPointers() {           // los remotos tienen llave de texto
  for (const k of [...Input.pointers.keys()]) if (typeof k !== 'string') Input.pointers.delete(k);
}
function releaseAll() {
  Input.pointers.clear();
  Key.left = false; Key.right = false;      // el blur solo limpiaba los punteros
}

for (const t of ['pointerup', 'pointercancel']) {
  cv.addEventListener(t, drop);
  window.addEventListener(t, drop);         // por si el up cae fuera del canvas
}
cv.addEventListener('pointerleave', drop);
cv.addEventListener('lostpointercapture', drop);

// Los eventos de toque traen la lista completa de dedos vivos: si no queda
// ninguno, no puede quedar ningun puntero local apretado. Es la unica
// reconciliacion que el navegador nos regala, y no depende de pointerup.
const noTouchesLeft = e => { if (e.touches && e.touches.length === 0) releaseLocalPointers(); };
window.addEventListener('touchend', noTouchesLeft, { passive: true });
window.addEventListener('touchcancel', noTouchesLeft, { passive: true });

window.addEventListener('blur', releaseAll);
window.addEventListener('pagehide', releaseAll);
// El cambio de app (visibilitychange) lo cubre el handler del arranque, que
// ademas tiene que apagar el motor: dos oyentes del mismo evento se pisan.

// Teclado, util para probar en escritorio
window.addEventListener('keydown', e => {
  if (e.repeat) return;
  if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') Key.left = true;
  if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') Key.right = true;
  if (e.key === ' ') { Key.left = true; Key.right = true; }
  if (e.key === 't' || e.key === 'T') Tint.cycle();   // el mismo easter egg, sin tocar el titulo
  Input.lastTouch = performance.now();
  Sfx.init(); Sfx.resume();
});
window.addEventListener('keyup', e => {
  if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') Key.left = false;
  if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') Key.right = false;
  if (e.key === ' ') { Key.left = false; Key.right = false; }
});

/* ============================ geometria ============================ */
const TAU = Math.PI * 2;
const rnd = (a, b) => a + Math.random() * (b - a);
const rndInt = (a, b) => Math.floor(rnd(a, b + 1));
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

// Roca irregular y asimetrica de contorno (§6)
function makeRock(radius) {
  const n = rndInt(8, 12);
  const pts = [];
  let ang = 0;
  for (let i = 0; i < n; i++) {
    ang += TAU / n * rnd(0.65, 1.35);
    const r = radius * rnd(0.62, 1.0);
    pts.push({ x: Math.cos(ang) * r, y: Math.sin(ang) * r });
  }
  return pts;
}

// Area de un contorno cerrado (formula del zapato). Como la masa de una roca es
// su area, esto es lo que se reparte al partirla.
function polyArea(pts) {
  let a = 0;
  for (let i = 0, j = pts.length - 1; i < pts.length; j = i++)
    a += pts[j].x * pts[i].y - pts[i].x * pts[j].y;
  return Math.abs(a) / 2;
}

// Centro de masa del contorno: es donde queda el eje de giro de cada mitad, que
// no es el centro de la roca de la que salio.
function polyCenter(pts) {
  let a = 0, cx = 0, cy = 0;
  for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
    const f = pts[j].x * pts[i].y - pts[i].x * pts[j].y;
    a += f; cx += (pts[j].x + pts[i].x) * f; cy += (pts[j].y + pts[i].y) * f;
  }
  if (Math.abs(a) < 1e-9) return { x: 0, y: 0 };
  return { x: cx / (3 * a), y: cy / (3 * a) };
}

// Corta un contorno por la recta que pasa por su origen con normal (nx, ny) y
// devuelve el trozo del lado positivo, cosido por donde el contorno cruza la
// recta. Llamandola dos veces con la normal al derecho y del reves salen las dos
// mitades: los mismos vertices de la roca, mas los dos puntos del corte.
function cutOutline(pts, nx, ny) {
  const out = [];
  for (let i = 0; i < pts.length; i++) {
    const p = pts[i], q = pts[(i + 1) % pts.length];
    const dp = p.x * nx + p.y * ny, dq = q.x * nx + q.y * ny;
    if (dp >= 0) out.push({ x: p.x, y: p.y });
    if ((dp >= 0) !== (dq >= 0)) {                 // el lado cruza: nace un vertice de corte
      const t = dp / (dp - dq);
      out.push({ x: p.x + (q.x - p.x) * t, y: p.y + (q.y - p.y) * t });
    }
  }
  return out;
}

// Contorno de la nave: triangulo alargado con la parte trasera curvada hacia
// adentro (§3). Se guarda como lista de puntos -> los segmentos son lo que se
// pierde al danarse y lo que sale despedido al morir.
function makeShipOutline() {
  const L = CFG.shipLen / 2, Wd = CFG.shipWid / 2;
  const nose = { x: L, y: 0 }, rc = { x: -L, y: Wd }, lc = { x: -L, y: -Wd };
  const lerp = (a, b, t) => ({ x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t });
  const pts = [nose];
  pts.push(lerp(nose, rc, 1 / 3), lerp(nose, rc, 2 / 3), rc);   // borde derecho en 3 tramos
  const cx = -L * 0.28, cy = 0;                                  // control de la curva concava
  for (let i = 1; i <= 6; i++) {                                 // popa curvada hacia adentro
    const t = i / 6, u = 1 - t;
    pts.push({ x: u * u * rc.x + 2 * u * t * cx + t * t * lc.x,
               y: u * u * rc.y + 2 * u * t * cy + t * t * lc.y });
  }
  pts.push(lerp(lc, nose, 1 / 3), lerp(lc, nose, 2 / 3));        // borde izquierdo en 3 tramos
  return pts;
}
const SHIP_PTS = makeShipOutline();
const SHIP_SEGS = (() => {
  const s = [];
  for (let i = 0; i < SHIP_PTS.length; i++) s.push([SHIP_PTS[i], SHIP_PTS[(i + 1) % SHIP_PTS.length]]);
  return s;
})();
const DAMAGED_HIDE = [1, 6]; // segmentos que faltan tras perder la primera vida

/* ============================ estado ============================ */
const SCREEN = { MENU: 'MENU', PLAY: 'PLAY', DEMO: 'DEMO', DEAD: 'DEAD', INITIALS: 'INITIALS',
                 SCORES: 'SCORES', LINK: 'LINK', ROTATE: 'ROTATE' };
let screen = SCREEN.MENU;
let prevScreen = SCREEN.MENU;

const G = {
  ship: null,
  meteors: [], bullets: [], pickups: [], shards: [], rings: [],
  score: 0, level: 1, nextLevelAt: CFG.levelBase,
  time: 0, spawnTimer: 0, refill: 0,
  flash: 0, levelBanner: 0, timeScale: 1,
  deathTimer: 0, attract: false, demo: false,
  entry: false, entryT: 0, entryD: 0,   // la nave todavia esta llegando: manda el autopiloto
  ready: 0,                             // s de parpadeo del relevo, justo despues de llegar
  buttons: [],
};

// La inercia lineal decae con constante de tiempo tau = -1/ln(1-shipFriction).
// El giro usa una fraccion de esa misma constante, asi que si mueves la friccion
// de la nave, el giro la sigue solo.
function rotTau() {
  return CFG.rotInertia * (-1 / Math.log(1 - CFG.shipFriction));
}

function newShip(x, y, a) {
  return {
    x, y, vx: 0, vy: 0, a: a === undefined ? -Math.PI / 2 : a, av: 0,
    lives: CFG.lives, damaged: false,
    invuln: 0, grace: 0, cd: 0, alive: true,
    left: false, right: false
  };
}

// Curva de dificultad continua: la maneja el puntaje, el nivel solo la anuncia (§10)
function curve() {
  const s = G.score;
  const t = clamp(s / 26000, 0, 1);           // progreso 0..1
  return {
    count:   Math.round(6 + t * 24),          // densidad objetivo
    sizeMin: (15 - t * 8) * CFG.objectScale,  // el nivel alto es un campo de rocas chicas
    sizeMax: (48 - t * 30) * CFG.objectScale,
    speed:   1 + t * 0.55,
    aimed:   0.10 + t * 0.35,                 // proporcion de meteoros directos
    predict: 0.03 + t * 0.20,                 // proporcion de predictivos
    // particion: la probabilidad sube del 5% al 10% con la curva, y el abanico con
    // que se abren las mitades tambien — de 10..17.5 grados a 10..25 (§6)
    split:    CFG.splitChanceMin + t * (CFG.splitChanceMax - CFG.splitChanceMin),
    splitAng: CFG.splitAngMin + (CFG.splitAngMax - CFG.splitAngMin) * (0.5 + 0.5 * t),
  };
}

function levelUp() {
  G.level++;
  G.nextLevelAt += CFG.levelBase + CFG.levelStep * (G.level - 1);
  G.flash = 1;
  G.levelBanner = 1.1;
  G.refill = CFG.refillTime;
  // Los meteoros restantes se disuelven SIN dar puntos (§11)
  for (const m of G.meteors) disintegrate(m, false);
  G.meteors.length = 0;
  Sfx.level();
}

function addScore(n) {
  G.score += n;
  while (G.score >= G.nextLevelAt) levelUp();
}

/* ============================ meteoros ============================ */
function spawnMeteor() {
  const c = curve();
  const s = G.ship;
  for (let attempt = 0; attempt < 12; attempt++) {
    const radius = rnd(c.sizeMin, Math.max(c.sizeMin + 4, c.sizeMax));
    // nacen FUERA de pantalla, pegados a un borde (§6)
    const edge = rndInt(0, 3);
    let x, y;
    const pad = radius + 12;
    if (edge === 0) { x = rnd(0, W); y = -pad; }
    else if (edge === 1) { x = W + pad; y = rnd(0, H); }
    else if (edge === 2) { x = rnd(0, W); y = H + pad; }
    else { x = -pad; y = rnd(0, H); }

    const speed = rnd(CFG.meteorSpeedMin, CFG.meteorSpeedMax) * c.speed;
    let dir;
    const roll = Math.random();
    if (s && roll < c.aimed) {                       // DIRECTO
      dir = Math.atan2(s.y - y, s.x - x) + rnd(-0.05, 0.05);
    } else if (s && roll < c.aimed + c.predict) {    // PREDICTIVO
      const d = Math.hypot(s.x - x, s.y - y);
      const t = d / speed;
      dir = Math.atan2(s.y + s.vy * t - y, s.x + s.vx * t - x) + rnd(-0.04, 0.04);
    } else {                                         // ALEATORIO
      // hacia adentro del campo, con desviacion
      dir = Math.atan2(H / 2 - y, W / 2 - x) + rnd(-1.0, 1.0);
    }
    const vx = Math.cos(dir) * speed, vy = Math.sin(dir) * speed;

    // Guarda de justicia: nada puede alcanzar a la nave en menos de medio segundo (§6)
    if (s && s.alive && !fair(x, y, vx, vy, radius, s)) continue;

    G.meteors.push({
      x, y, vx, vy, a: rnd(0, TAU), va: rnd(-CFG.meteorRotMax, CFG.meteorRotMax),
      pts: makeRock(radius), r: radius,
      splits: 0                                    // veces que ya se partio: baja su probabilidad de partirse (§6)
    });
    return;
  }
}
function fair(x, y, vx, vy, r, s) {
  const dx = x - s.x, dy = y - s.y;
  const rvx = vx - s.vx, rvy = vy - s.vy;
  const vv = rvx * rvx + rvy * rvy;
  if (vv < 1e-4) return true;
  let t = -(dx * rvx + dy * rvy) / vv;
  if (t < 0) return true;
  if (t > CFG.fairnessTime) return true;
  const cx = dx + rvx * t, cy = dy + rvy * t;
  return Math.hypot(cx, cy) > r + CFG.shipRadius + 6;
}

function disintegrate(m, giveDrop) {
  const ca = Math.cos(m.a), sa = Math.sin(m.a);
  for (let i = 0; i < m.pts.length; i++) {
    const p = m.pts[i], q = m.pts[(i + 1) % m.pts.length];
    const mid = { x: (p.x + q.x) / 2, y: (p.y + q.y) / 2 };
    G.shards.push({
      x: m.x + mid.x * ca - mid.y * sa,
      y: m.y + mid.x * sa + mid.y * ca,
      ax: (p.x - mid.x), ay: (p.y - mid.y),
      bx: (q.x - mid.x), by: (q.y - mid.y),
      a: m.a, va: rnd(-3, 3),
      vx: m.vx + rnd(-70, 70), vy: m.vy + rnd(-70, 70),
      life: rnd(0.4, 0.8), max: 0.8
    });
  }
  if (giveDrop && Math.random() < dropOdds(m.r)) spawnPickup(m);
}

// Probabilidad de soltar pickup segun el tamano, relativa al rango del nivel
// actual: la roca mas chica paga +50%, la mas grande -50%. El promedio no cambia,
// solo se reparte: tirarle a la grava rinde mas que tirarle a los bloques.
function dropOdds(r) {
  const c = curve();
  const lo = c.sizeMin, hi = Math.max(c.sizeMin + 4, c.sizeMax);
  const t = clamp((r - lo) / Math.max(1, hi - lo), 0, 1);   // 0 = la mas chica, 1 = la mas grande
  return CFG.dropChance * (1 + CFG.dropSizeBias - t * 2 * CFG.dropSizeBias);
}

function spawnPickup(m) {
  // Dos recolectables. El de reparacion solo cae si hay algo que reparar:
  // un pickup inutil seria una recompensa vacia por un tiro bien puesto.
  const canRepair = G.ship && G.ship.damaged && G.ship.lives < CFG.lives;
  const kind = (canRepair && Math.random() < CFG.repairChance) ? 'repair' : 'shield';
  G.pickups.push({
    x: m.x, y: m.y,
    vx: m.vx * 0.45 + rnd(-15, 15), vy: m.vy * 0.45 + rnd(-15, 15),
    t: 0, r: 13 * CFG.pickupScale, kind
  });
}

/* ============================ update de partida ============================ */
// Tres modos con la misma partida detras (§12.2):
//   'play'    — la maneja el jugador.
//   'attract' — la maneja el bot de fondo, detras del menu: se ve apagada,
//               no se oye y no vibra. Arranca sola por inactividad.
//   'demo'    — esa misma partida del bot, pero elegida a proposito en el menu:
//               pantalla completa, marcador, sonido y los carteles que explican
//               que esta apretando la maquina. Es la que ensena a jugar.
function startGame(mode) {
  G.meteors.length = 0; G.bullets.length = 0; G.pickups.length = 0;
  G.shards.length = 0; G.rings.length = 0;
  G.score = 0; G.level = 1; G.nextLevelAt = CFG.levelBase;
  G.time = 0; G.spawnTimer = 0; G.refill = 0;   // el campo se llena cuando la nave llega, no antes
  G.flash = 0; G.levelBanner = 0; G.timeScale = 1; G.deathTimer = 0;
  G.attract = mode !== 'play';      // en los dos demos vuela la maquina
  G.demo    = mode === 'demo';
  Sfx.quiet = G.attract && !G.demo; // la de fondo se ve pero no se oye; la elegida suena
  // La partida no empieza con la nave puesta en el centro: empieza con la nave
  // llegando. Nace quieta, fuera de la pantalla, pegada a un borde al azar y con
  // el morro girado al azar, y entra manejando con los mismos motores, la misma
  // inercia y la misma deriva que va a tener el jugador. Hasta que llega
  // al centro no hay control, ni disparo, ni puntaje, ni choques. Los tres modos
  // entran igual: la demo tiene que ensenar la partida que el jugador va a jugar.
  const e = entryStart();
  G.ship = newShip(e.x, e.y, e.a);
  G.entry = true; G.entryT = 0; G.entryD = 0; G.ready = 0;
  if (mode === 'play') screen = SCREEN.PLAY;
  else if (mode === 'demo') screen = SCREEN.DEMO;
}

// Punto y rumbo de entrada: un borde al azar —sorteado con peso, ver abajo— y
// el morro apuntando adentro con una desviacion aleatoria. Esa desviacion es lo
// que hace que cada entrada sea una curva distinta —la nave tiene que corregir
// el rumbo mientras acelera— en vez de la misma recta al centro todas las
// partidas.
function entryStart() {
  const pad = CFG.entryPad;
  // Los cuatro bordes entran en el sorteo, pero pesan lo inverso de lo que hay
  // que cruzar desde cada uno: en una tele ancha, venir del costado es medio
  // campo de viaje y la partida se hace esperar, asi que sale mas seguido por
  // arriba o por abajo. En una pantalla cuadrada los cuatro pesan casi igual.
  const wv = 2 / H, wh = 2 / W;
  let r = Math.random() * (2 * wv + 2 * wh), edge = 3;
  if ((r -= wv) < 0) edge = 0;
  else if ((r -= wh) < 0) edge = 1;
  else if ((r -= wv) < 0) edge = 2;
  // Y dentro del borde, el punto tira al medio: nacer en una esquina es cruzar
  // la pantalla en diagonal, que es el viaje mas largo que existe. Sale el borde
  // entero, pero el medio mas seguido.
  const along = (Math.random() + Math.random() + Math.random()) / 3;
  let x, y;
  if (edge === 0)      { x = along * W; y = -pad; }
  else if (edge === 1) { x = W + pad;   y = along * H; }
  else if (edge === 2) { x = along * W; y = H + pad; }
  else                 { x = -pad;      y = along * H; }
  const a = Math.atan2(H / 2 - y, W / 2 - x) + rnd(-CFG.entrySpread, CFG.entrySpread);
  return { x, y, a };
}

// Autopiloto de entrada, en dos tramos. Frenar y girar son el mismo par de
// motores —con los dos puestos la nave no gira—, asi que no se puede corregir el
// rumbo y llegar despacio a la vez: primero se apunta, despues se frena.
//   lejos  — cruza a fondo, corrigiendo la punteria cada vez mas fino
//   cerca  — los dos motores: entra recta, frenando hasta el piso
function entryControl(s) {
  const dx = W / 2 - s.x, dy = H / 2 - s.y;
  const d = Math.hypot(dx, dy);
  const bearing = Math.atan2(dy, dx);
  if (d < CFG.entryBrake) return { left: true, right: true };

  // La nave deriva: el morro y la marcha no coinciden. Apuntar el morro al
  // centro la haria pasar de largo, asi que se apunta mas alla, tanto como se
  // desvie la marcha, y es la trayectoria la que queda encarada.
  let want = bearing;
  if (Math.hypot(s.vx, s.vy) > 20) {
    const err = ((bearing - Math.atan2(s.vy, s.vx) + Math.PI) % TAU + TAU) % TAU - Math.PI;
    want = bearing + clamp(err * CFG.entryLead, -1, 1);
  }
  // El error de rumbo se paga multiplicado por lo que falta: a 400 px, medio
  // grado ya son tres pixeles de desvio. Por eso la tolerancia se cierra sola.
  return steerTo(s, want, false, clamp(CFG.entryAim / d, 0.02, 0.18));
}

// La entrada termina en el punto mas cercano al centro. Con avance constante la
// nave no puede clavarse ahi, asi que la llegada es el instante en que deja de
// acercarse; el radio y el tope de tiempo son solo redes de seguridad. Ahi
// empieza la partida: el mando pasa al jugador, la nave vuelve a envolverse por
// los bordes, corre la gracia de siempre y el campo —vacio hasta ahora— se
// empieza a llenar desde cero, igual que al subir de nivel.
function updateEntry(s, dt) {
  G.entryT += dt;
  const d = Math.hypot(W / 2 - s.x, H / 2 - s.y);
  // Lo de alejarse solo cuenta en el tramo final: recien salida del borde, la
  // nave se aleja un momento mientras endereza, y eso no es haber llegado.
  const paso = G.entryD > 0 && d > G.entryD && d < CFG.entryBrake * 2;
  G.entryD = d;
  if (d > CFG.entryArrive && !paso && G.entryT < CFG.entryMax) return;
  G.entry = false;
  s.x = (s.x % W + W) % W; s.y = (s.y % H + H) % H;
  s.grace = CFG.entryGrace;
  G.refill = CFG.refillTime;
  // El relevo se anuncia: la nave parpadea y sale un anillo de donde esta. Es
  // el mismo anillo de los recolectables, que ya significa "algo cambio aca".
  G.ready = CFG.readyBlink;
  G.rings.push({ x: s.x, y: s.y, r: 6, life: 0.45, max: 0.45 });
}

function shipCopies(s) {
  // Solo la nave se envuelve. Mientras cruza se dibuja partida en ambos bordes,
  // y en las cuatro esquinas si toca dos (§5).
  const out = [{ x: s.x, y: s.y }];
  if (G.entry) return out;          // llegando esta fuera del campo: no hay borde que cruzar
  const m = CFG.shipLen;
  const dxs = s.x < m ? [W] : s.x > W - m ? [-W] : [];
  const dys = s.y < m ? [H] : s.y > H - m ? [-H] : [];
  for (const dx of dxs) out.push({ x: s.x + dx, y: s.y });
  for (const dy of dys) out.push({ x: s.x, y: s.y + dy });
  for (const dx of dxs) for (const dy of dys) out.push({ x: s.x + dx, y: s.y + dy });
  return out;
}

function updatePlay(dt) {
  const s = G.ship;
  G.time += dt;

  // ---- llegada ----
  // Se resuelve antes que nada: asi ningun frame sale mitad entrada y mitad
  // partida (el ultimo empujon del autopiloto disparando por el jugador, medio
  // frame de goteo de puntaje regalado).
  if (G.entry) updateEntry(s, dt);

  // ---- control ----
  let L, R;
  if (G.entry) { const e = entryControl(s); L = e.left; R = e.right; }   // llegando: manda el autopiloto
  else if (G.attract) { const b = botControl(s); L = b.left; R = b.right; }
  else { L = Input.left; R = Input.right; }
  if (!s.alive) { L = false; R = false; }
  s.left = L; s.right = R;

  const both = L && R;
  // Rotacion pura: no desplaza (§4). Ahora con inercia: la velocidad angular
  // persigue al objetivo, no salta. Soltar el motor deja el giro corriendo un poco.
  const targetAv = both ? 0 : ((R ? CFG.shipRot : 0) - (L ? CFG.shipRot : 0));
  s.av += (targetAv - s.av) * (1 - Math.exp(-dt / rotTau()));
  s.a += s.av * dt;
  // El motor de la demo elegida SI suena: oir el chorro justo cuando se enciende
  // la etiqueta de abajo es media explicacion. El de la demo de fondo no.
  Sfx.engine((L || R) && (!G.attract || G.demo) && s.alive);

  const maxSp = CFG.shipMaxSpeed * curve().speed;

  // Avance constante: la nave nunca deja de ir hacia adelante.
  // Ambos motores = retro, frena ligeramente (no puede detenerse).
  if (!both) {
    s.vx += Math.cos(s.a) * CFG.cruiseThrust * dt;
    s.vy += Math.sin(s.a) * CFG.cruiseThrust * dt;
  }

  // friccion baja: al girar, la velocidad vieja sigue un rato -> deriva
  const f = Math.pow(1 - CFG.shipFriction, dt);
  s.vx *= f; s.vy *= f;

  let sp = Math.hypot(s.vx, s.vy);
  if (both && sp > 1) {
    // piso duro: el freno recorta hasta brakeFloor y ahi se queda. Nunca detiene la nave.
    const target = Math.max(CFG.brakeFloor * maxSp, sp - CFG.brakeDecel * dt);
    s.vx = s.vx / sp * target; s.vy = s.vy / sp * target; sp = target;
  }
  if (sp > maxSp) { s.vx = s.vx / sp * maxSp; s.vy = s.vy / sp * maxSp; }
  s.x += s.vx * dt; s.y += s.vy * dt;
  // Mientras llega esta fuera del campo a proposito: envolverla ahi la sacaria
  // por el borde contrario en vez de dejarla entrar (§5).
  if (!G.entry) { s.x = (s.x % W + W) % W; s.y = (s.y % H + H) % H; }

  // ---- disparo: cualquier motor encendido dispara (§7) ----
  s.cd -= dt;
  if ((L || R) && s.alive && !G.entry && s.cd <= 0 && G.bullets.length < CFG.maxBullets) {
    s.cd = CFG.fireInterval;
    const nose = CFG.shipLen / 2;
    const bvx = s.vx + Math.cos(s.a) * CFG.bulletSpeed;
    const bvy = s.vy + Math.sin(s.a) * CFG.bulletSpeed;
    // Giro de la bala (§7.1). El piso lo pone la velocidad de la nave: cuanto
    // mas rapido va el cohete, mas rapido gira lo que suelta, y nunca sale
    // quieta. Encima puede ganarle el giro propio de la nave, asi que disparar
    // en plena curva escupe balas mas revueltas que disparar derecho.
    const spinFloor = CFG.bulletSpinMin +
      (CFG.bulletSpinMax - CFG.bulletSpinMin) * clamp(sp / maxSp, 0, 1);
    const spin = Math.max(spinFloor, Math.abs(s.av) * CFG.bulletSpinKick);
    G.bullets.push({
      x: s.x + Math.cos(s.a) * nose, y: s.y + Math.sin(s.a) * nose,
      vx: bvx, vy: bvy,
      a: s.a,                                        // sale alineada con el disparo
      av: spin * (s.av < 0 ? -1 : 1),                // y gira hacia donde giraba la nave
      len: Math.hypot(bvx, bvy) * CFG.bulletStreak,  // largo fijo: ya no lo marca la velocidad de vuelo
      life: CFG.bulletLife, max: CFG.bulletLife
    });
    Sfx.shoot();
  }

  if (s.invuln > 0) s.invuln -= dt;
  if (s.grace > 0) s.grace -= dt;
  if (G.ready > 0) G.ready -= dt;

  // ---- goteo por tiempo (§10) ----
  // La entrada no paga: el reloj corre cuando el jugador ya maneja.
  if (!G.entry) addScore(CFG.timeDrip * (1 + G.level * 0.14) * dt);

  // ---- spawn ----
  // Mientras la nave llega no hay campo: la entrada es la nave y nada mas, y las
  // rocas empiezan a entrar recien cuando el jugador tiene el mando.
  if (!G.entry) {
    const c = curve();
    const target = G.refill > 0
      ? Math.round(c.count * (1 - G.refill / CFG.refillTime))
      : c.count;
    if (G.refill > 0) G.refill -= dt;
    G.spawnTimer -= dt;
    const live = G.meteors.length;
    if (G.spawnTimer <= 0 && G.meteors.length < target + 8 && live < target) {
      // el relleno tras subir de nivel debe tardar segundos, no medio minuto (§11):
      // el ritmo real lo marca la rampa de 'target', el spawner solo la sigue
      const deficit = target - live;
      G.spawnTimer = clamp(0.4 / Math.max(1, deficit), 0.04, 0.4);
      spawnMeteor();
    }
  }

  // ---- meteoros: linea recta para siempre, sin envolverse (§5,§6) ----
  for (let i = G.meteors.length - 1; i >= 0; i--) {
    const m = G.meteors[i];
    m.x += m.vx * dt; m.y += m.vy * dt; m.a += m.va * dt;
    const pad = m.r + 40;
    if (m.x < -pad || m.x > W + pad || m.y < -pad || m.y > H + pad) G.meteors.splice(i, 1);
  }

  // ---- balas ----
  for (let i = G.bullets.length - 1; i >= 0; i--) {
    const b = G.bullets[i];
    b.x += b.vx * dt; b.y += b.vy * dt; b.a += b.av * dt; b.life -= dt;
    if (b.life <= 0 || b.x < 0 || b.x > W || b.y < 0 || b.y > H) { G.bullets.splice(i, 1); continue; }
    for (let j = G.meteors.length - 1; j >= 0; j--) {
      const m = G.meteors[j];
      if (Math.hypot(b.x - m.x, b.y - m.y) > m.r) continue;
      if (!pointInRock(b.x, b.y, m)) continue;
      G.bullets.splice(i, 1);
      hitMeteor(j, b);            // la bala va con ella: su velocidad es la que pone a girar las mitades
      break;
    }
  }

  // ---- pickups ----
  for (let i = G.pickups.length - 1; i >= 0; i--) {
    const p = G.pickups[i];
    p.x += p.vx * dt; p.y += p.vy * dt; p.t += dt;
    if (p.x < -40 || p.x > W + 40 || p.y < -40 || p.y > H + 40) { G.pickups.splice(i, 1); continue; }
    if (s.alive && !G.entry) {
      for (const cpy of shipCopies(s)) {
        if (Math.hypot(p.x - cpy.x, p.y - cpy.y) < p.r + CFG.shipRadius) {
          G.pickups.splice(i, 1);
          if (p.kind === 'repair') {
            s.lives = Math.min(CFG.lives, s.lives + 1);
            s.damaged = false;         // la nave recupera su contorno completo
            Sfx.repair(); buzz([20, 40, 20]);
            G.rings.push({ x: p.x, y: p.y, r: 34, life: 0.5, max: 0.5, inward: true });
          } else {
            s.invuln = CFG.invulnTime;
            Sfx.pickup(); buzz(20);
            G.rings.push({ x: p.x, y: p.y, r: 8, life: 0.5, max: 0.5 });
          }
          break;
        }
      }
    }
  }

  // ---- colision nave / meteoros ----
  // Entrando no choca: seria morir por algo que el jugador no podia esquivar.
  if (s.alive && !G.entry && s.invuln <= 0 && s.grace <= 0) {
    outer:
    for (const cpy of shipCopies(s)) {
      for (let j = G.meteors.length - 1; j >= 0; j--) {
        const m = G.meteors[j];
        if (Math.hypot(cpy.x - m.x, cpy.y - m.y) > m.r + CFG.shipRadius) continue;
        if (!circleHitsRock(cpy.x, cpy.y, CFG.shipRadius, m)) continue;
        damageShip();
        break outer;
      }
    }
  }

  // ---- shards / rings ----
  for (let i = G.shards.length - 1; i >= 0; i--) {
    const d = G.shards[i];
    d.x += d.vx * dt; d.y += d.vy * dt; d.a += d.va * dt;
    d.vx *= 0.99; d.vy *= 0.99; d.life -= dt;
    if (d.life <= 0) G.shards.splice(i, 1);
  }
  for (let i = G.rings.length - 1; i >= 0; i--) {
    const r = G.rings[i];
    r.r += (r.inward ? -60 : 130) * dt; r.life -= dt;
    if (r.r < 2) r.r = 2;
    if (r.life <= 0) G.rings.splice(i, 1);
  }

  if (G.flash > 0) G.flash -= dt * 3.2;
  if (G.levelBanner > 0) G.levelBanner -= dt;

  // ---- muerte ----
  if (!s.alive) {
    G.deathTimer += dt;
    G.timeScale = clamp(0.22 + G.deathTimer * 0.9, 0.22, 1);
    if (G.deathTimer > 1.5) {
      // la maquina no entra al top 10: se le arma otra partida en el mismo modo
      if (G.attract) startGame(G.demo ? 'demo' : 'attract');
      else endRun();
    }
  }
}

// Particion (§6): de vez en cuando la bala no revienta la roca, la parte en dos.
// El corte va en la direccion de la marcha, asi que las mitades se abren a los
// lados, y no es un 50/50: cada mitad se queda con el 40% de la masa y el 20%
// que sobra se va en polvo por la linea del corte.
//
// Cada mitad es literalmente la roca de antes cortada por el medio: los mismos
// vertices, la misma orientacion y la misma velocidad que traia la madre —solo
// cambia la direccion, que se abre entre 10 y 25 grados hacia su lado, con el
// tope puesto por la dificultad—. El contorno cortado ronda el 50% del area, asi
// que se encoge lo justo para dejarlo en el 40% exacto sin cambiar de forma.
//
// El golpe ademas las pone a girar: el giro va con la velocidad de la bala y en
// contra del radio de la mitad (un cascote chico voltea mas), se suma al giro que
// la roca ya traia y sale en sentidos opuestos, que es como se abre lo que se parte.
//
// Devuelve false si las mitades saldrian demasiado chicas para verse o si el
// corte no deja dos trozos limpios; ahi el disparo se cobra la roca entera.
function splitMeteor(index, bulletSpeed) {
  const m = G.meteors[index];
  const rHalf = m.r * Math.sqrt(CFG.splitKeep);
  if (rHalf < CFG.splitMinRadius) return false;

  const speed = Math.hypot(m.vx, m.vy);
  const dir = speed > 1e-3 ? Math.atan2(m.vy, m.vx) : m.a;
  const area = polyArea(m.pts);
  if (area < 1e-6) return false;

  // la recta del corte sigue la marcha; su normal (en coordenadas de la roca) es
  // la perpendicular, y es por ahi por donde se separan las dos mitades
  const nl = dir + Math.PI / 2 - m.a;
  const nx = Math.cos(nl), ny = Math.sin(nl);
  const halves = [cutOutline(m.pts, nx, ny), cutOutline(m.pts, -nx, -ny)];
  if (halves.some(h => h.length < 3 || polyArea(h) < area * 0.05)) return false;

  const c = curve();
  const ang = rnd(CFG.splitAngMin, c.splitAng) * Math.PI / 180;
  const spin = clamp(CFG.splitSpinGain * bulletSpeed / rHalf, 0, CFG.splitSpinMax);
  const worth = 80 + 1600 / Math.max(4, m.r);       // lo que valia entera
  const ca = Math.cos(m.a), sa = Math.sin(m.a);
  const mx = m.x, my = m.y, mvx = m.vx, mvy = m.vy, ma = m.a, mva = m.va;
  const splits = (m.splits || 0) + 1;
  G.meteors.splice(index, 1);

  halves.forEach((pts, i) => {
    const side = i === 0 ? 1 : -1;                  // 0 = la del lado de la normal
    const k = Math.sqrt(CFG.splitKeep * area / polyArea(pts));   // del ~50% cortado al 40% exacto
    const cen = polyCenter(pts);
    let r = 0;
    for (const p of pts) {
      p.x = (p.x - cen.x) * k; p.y = (p.y - cen.y) * k;
      r = Math.max(r, Math.hypot(p.x, p.y));
    }
    const ox = cen.x + nx * CFG.splitGap * side, oy = cen.y + ny * CFG.splitGap * side;
    const d = dir + ang * side;
    G.meteors.push({
      x: mx + ox * ca - oy * sa, y: my + ox * sa + oy * ca,
      vx: Math.cos(d) * speed, vy: Math.sin(d) * speed,   // la velocidad es la que traia
      a: ma, va: clamp(mva + spin * side, -CFG.splitSpinMax, CFG.splitSpinMax),
      pts, r, splits
    });
  });

  // el 20% que no se lleva ninguna mitad se va en polvo, a lo largo del corte
  const dx = Math.cos(dir), dy = Math.sin(dir);
  for (let i = 0; i < 3; i++) {
    const t = rnd(-0.5, 0.5) * m.r, len = clamp(m.r * 0.18, 1.2, 4);
    const sd = Math.random() < 0.5 ? 1 : -1, kick = rnd(20, 60);
    G.shards.push({
      x: mx + dx * t, y: my + dy * t,
      ax: -dx * len, ay: -dy * len, bx: dx * len, by: dy * len,
      a: 0, va: rnd(-3, 3),
      vx: mvx - dy * sd * kick, vy: mvy + dx * sd * kick,
      life: rnd(0.3, 0.6), max: 0.6
    });
  }

  G.rings.push({ x: mx, y: my, r: m.r, life: 0.28, max: 0.28 });
  Sfx.destroy(); buzz(10);
  addScore(Math.round((1 - 2 * CFG.splitKeep) * worth));  // paga el polvo; las mitades se cobran aparte
  return true;                                            // ultimo: puede disparar levelUp y vaciar el campo
}

function hitMeteor(index, bullet) {
  const m = G.meteors[index];
  // Casi siempre una bala revienta una roca. La excepcion es partirla en dos, y
  // cada mitad hereda la mitad de la probabilidad de su madre: partir y volver a
  // partir se agota solo (§6).
  const odds = curve().split * Math.pow(CFG.splitDecay, m.splits || 0);
  const bSpeed = bullet ? Math.hypot(bullet.vx, bullet.vy) : CFG.bulletSpeed;
  if (Math.random() < odds && splitMeteor(index, bSpeed)) return;
  G.meteors.splice(index, 1);
  addScore(Math.round(80 + 1600 / Math.max(4, m.r)));   // mas puntos entre mas chica
  disintegrate(m, true);
  Sfx.destroy(); buzz(18);
}

function damageShip() {
  const s = G.ship;
  s.lives--;
  if (s.lives > 0) {
    s.damaged = true;                 // unica indicacion de vidas que existe (§3)
    s.grace = CFG.hitGrace;
    Sfx.damage(); buzz([30, 40, 30]);
    G.flash = 0.7;
    G.rings.push({ x: s.x, y: s.y, r: 10, life: 0.4, max: 0.4 });
  } else {
    s.alive = false;
    G.deathTimer = 0; G.timeScale = 0.22;
    Sfx.engine(false); Sfx.death(); buzz([40, 60, 120]);
    // la nave se descompone en los mismos segmentos con que esta dibujada (§9)
    const ca = Math.cos(s.a), sa = Math.sin(s.a);
    SHIP_SEGS.forEach((seg, i) => {
      if (s.damaged && DAMAGED_HIDE.includes(i)) return;
      const mid = { x: (seg[0].x + seg[1].x) / 2, y: (seg[0].y + seg[1].y) / 2 };
      G.shards.push({
        x: s.x + mid.x * ca - mid.y * sa,
        y: s.y + mid.x * sa + mid.y * ca,
        ax: seg[0].x - mid.x, ay: seg[0].y - mid.y,
        bx: seg[1].x - mid.x, by: seg[1].y - mid.y,
        a: s.a, va: rnd(-4, 4),
        vx: s.vx + rnd(-90, 90), vy: s.vy + rnd(-90, 90),
        life: 1.6, max: 1.6
      });
    });
  }
}

function pointInRock(px, py, m) {
  const dx = px - m.x, dy = py - m.y;
  const ca = Math.cos(-m.a), sa = Math.sin(-m.a);
  const lx = dx * ca - dy * sa, ly = dx * sa + dy * ca;
  let inside = false;
